<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 3000" width="1600" height="3000" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">RouterUtils high-level design</title>
  <desc id="diagram-desc">RouterUtils builds hierarchical routes from component metadata, resolves a pathname, handles error and custom-render branches, and renders a component into the root element.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      <![CDATA[
        svg { background: #ffffff; text-rendering: geometricPrecision; }
        text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
        .title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
        .subtitle { font-size: 17px; fill: #64748b; }
        .section { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; fill: #0f766e; }
        .label { font-size: 16px; font-weight: 700; fill: #1f2937; }
        .entry-label { fill: #ffffff; }
        .note { font-size: 14px; fill: #64748b; }
        .branch { font-size: 14px; font-weight: 700; fill: #475569; }
        .source { font-size: 13px; fill: #64748b; }
        .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
        .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
        .card { width: 360px; height: 64px; rx: 10; stroke-width: 2; }
        .entry { fill: #0f766e; stroke: #0f766e; }
        .process { fill: #ffffff; stroke: #cbd5e1; }
        .decision { fill: #fffaf0; stroke: #d6a24e; }
        .effect { fill: #f0fdf4; stroke: #9ac7a3; }
        .skip { fill: #f8fafc; stroke: #94a3b8; }
        .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      ]]>
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="3000" fill="#ffffff"/>
  <rect x="50" y="42" width="230" height="28" rx="14" fill="#e9f7f5"/>
  <text x="165" y="61" text-anchor="middle" class="section">UTILS HLD</text>
  <text x="50" y="112" class="title">RouterUtils</text>
  <text x="50" y="144" class="subtitle">Route-tree preparation, pathname matching, and DOM rendering decisions</text>
  <line x1="50" y1="174" x2="1550" y2="174" stroke="#dbe4ee" stroke-width="1.5"/>

  <rect x="50" y="205" width="1500" height="625" rx="18" class="frame"/>
  <rect x="50" y="205" width="6" height="625" rx="3" fill="#0f766e"/>
  <text x="85" y="250" class="section">01 / PREPARE ROUTES FROM COMPONENTS</text>
  <text x="85" y="278" class="note">Used by DotaRouterService when config.routes is not supplied.</text>

  <rect x="620" y="340" width="360" height="64" class="card entry"/>
  <text x="800" y="380" text-anchor="middle" class="label entry-label">prepareConfig(elements)</text>
  <rect x="620" y="495" width="360" height="64" class="card process"/>
  <text x="800" y="535" text-anchor="middle" class="label">extract Route metadata</text>
  <text x="800" y="584" text-anchor="middle" class="note">routeMap keyed by config.path</text>
  <rect x="620" y="650" width="360" height="64" class="card process"/>
  <text x="800" y="690" text-anchor="middle" class="label">root “/” + addRoute recursion</text>
  <text x="800" y="739" text-anchor="middle" class="note">flat component routes become a hierarchy</text>

  <path d="M 800 404 V 495" class="connector"/>
  <path d="M 800 559 V 650" class="connector"/>

  <rect x="50" y="880" width="1500" height="1840" rx="18" class="frame"/>
  <rect x="50" y="880" width="6" height="1840" rx="3" fill="#0f766e"/>
  <text x="85" y="925" class="section">02 / RESOLVE AND RENDER</text>
  <text x="85" y="953" class="note">The adapter supplies pathname, routes, router context, and optional render settings.</text>

  <rect x="500" y="1010" width="360" height="64" class="card entry"/>
  <text x="680" y="1050" text-anchor="middle" class="label entry-label">RouterUtils.render(config)</text>
  <rect x="500" y="1165" width="360" height="64" class="card decision"/>
  <text x="680" y="1205" text-anchor="middle" class="label">root element found?</text>
  <rect x="1000" y="1165" width="360" height="64" class="card skip"/>
  <text x="1180" y="1205" text-anchor="middle" class="label">log error → return</text>
  <text x="1180" y="1254" text-anchor="middle" class="note">root metadata selector not found</text>

  <rect x="500" y="1320" width="360" height="64" class="card decision"/>
  <text x="680" y="1360" text-anchor="middle" class="label">path === “/error”?</text>
  <rect x="1000" y="1320" width="360" height="64" class="card decision"/>
  <text x="1180" y="1360" text-anchor="middle" class="label">error component metadata?</text>
  <rect x="1000" y="1475" width="360" height="64" class="card effect"/>
  <text x="1180" y="1515" text-anchor="middle" class="label">render error element</text>
  <text x="1180" y="1564" text-anchor="middle" class="note">message option or “Path not found”</text>

  <rect x="500" y="1475" width="360" height="64" class="card process"/>
  <text x="680" y="1515" text-anchor="middle" class="label">findRoute(path, routes)</text>
  <text x="480" y="1564" text-anchor="end" class="note">exact → prefix + children → getChildPath</text>
  <text x="480" y="1588" text-anchor="end" class="note">recursive lookup → parent fallback</text>

  <rect x="500" y="1630" width="360" height="64" class="card decision"/>
  <text x="680" y="1670" text-anchor="middle" class="label">route found?</text>
  <rect x="1000" y="1630" width="360" height="64" class="card effect"/>
  <text x="1180" y="1670" text-anchor="middle" class="label">route(router, “/error”)</text>
  <text x="1180" y="1719" text-anchor="middle" class="note">normalize slash → adapter.route(path)</text>

  <rect x="500" y="1785" width="360" height="64" class="card decision"/>
  <text x="680" y="1825" text-anchor="middle" class="label">route.render exists?</text>
  <rect x="1000" y="1785" width="360" height="64" class="card effect"/>
  <text x="1180" y="1825" text-anchor="middle" class="label">route.render(path)</text>
  <text x="1180" y="1874" text-anchor="middle" class="note">custom rendering owns the DOM effect</text>

  <rect x="500" y="1940" width="360" height="64" class="card decision"/>
  <text x="680" y="1980" text-anchor="middle" class="label">component metadata exists?</text>
  <rect x="1000" y="1940" width="360" height="64" class="card effect"/>
  <text x="1180" y="1980" text-anchor="middle" class="label">replace root.innerHTML</text>
  <text x="1180" y="2029" text-anchor="middle" class="note">&lt;component-selector path="path"&gt;</text>
  <rect x="1000" y="2095" width="360" height="64" class="card skip"/>
  <text x="1180" y="2135" text-anchor="middle" class="label">log component error</text>

  <path d="M 680 1074 V 1165" class="connector"/>
  <path d="M 860 1197 H 1000" class="connector"/>
  <text x="882" y="1181" class="branch">no</text>
  <path d="M 680 1229 V 1320" class="connector"/>
  <text x="700" y="1275" class="branch">yes</text>
  <path d="M 860 1352 H 1000" class="connector"/>
  <text x="882" y="1336" class="branch">yes</text>
  <path d="M 1180 1384 V 1475" class="connector"/>
  <text x="1200" y="1432" class="branch">yes</text>
  <path d="M 1000 1352 H 940 V 1507 H 860" class="connector"/>
  <text x="948" y="1434" class="branch">no: log + continue</text>
  <path d="M 680 1384 V 1475" class="connector"/>
  <text x="700" y="1432" class="branch">no</text>
  <path d="M 680 1539 V 1630" class="connector"/>
  <path d="M 860 1662 H 1000" class="connector"/>
  <text x="882" y="1646" class="branch">no</text>
  <path d="M 680 1694 V 1785" class="connector"/>
  <text x="700" y="1740" class="branch">yes</text>
  <path d="M 860 1817 H 1000" class="connector"/>
  <text x="882" y="1801" class="branch">yes</text>
  <path d="M 680 1849 V 1940" class="connector"/>
  <text x="700" y="1895" class="branch">no</text>
  <path d="M 860 1972 H 1000" class="connector"/>
  <text x="882" y="1956" class="branch">yes</text>
  <path d="M 680 2004 V 2060 H 940 V 2127 H 1000" class="connector"/>
  <text x="700" y="2050" class="branch">no</text>

  <rect x="85" y="2240" width="1430" height="125" rx="12" class="lane"/>
  <text x="115" y="2282" class="section">PATH HELPERS</text>
  <text x="260" y="2282" class="note">getCurrentPath() reads window.location.pathname.</text>
  <text x="260" y="2310" class="note">getPreviousPath() reads the Navigation API entry list; getNextPath(), getParentPath(), and isParent() support path calculations.</text>
  <text x="85" y="2410" class="source">Source: packages/libs/dota-router/src/RouterUtils.ts · Types.ts</text>
  <text x="85" y="2437" class="source">Related: dota-router-service-hld.svg · dota-router-adapters-hld.svg</text>
</svg>
