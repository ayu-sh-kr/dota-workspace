<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2050" width="1500" height="2050" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">DotaRouterService high-level design</title>
  <desc id="diagram-desc">The service factory chooses a route source, constructs the configured router, initializes it, and delegates later route calls to the router instance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      <![CDATA[
        svg { background: #ffffff; text-rendering: geometricPrecision; }
        text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
        .title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
        .subtitle { font-size: 17px; fill: #64748b; }
        .section { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; fill: #3157c9; }
        .label { font-size: 16px; font-weight: 700; fill: #1f2937; }
        .entry-label { fill: #ffffff; }
        .note { font-size: 14px; fill: #64748b; }
        .branch { font-size: 14px; font-weight: 700; fill: #475569; }
        .source { font-size: 13px; fill: #64748b; }
        .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
        .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
        .card { width: 360px; height: 64px; rx: 10; stroke-width: 2; }
        .entry { fill: #3157c9; stroke: #3157c9; }
        .process { fill: #ffffff; stroke: #cbd5e1; }
        .decision { fill: #fffaf0; stroke: #d6a24e; }
        .skip { fill: #f8fafc; stroke: #94a3b8; }
        .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      ]]>
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="2050" fill="#ffffff"/>
  <rect x="50" y="42" width="245" height="28" rx="14" fill="#eef2ff"/>
  <text x="172" y="61" text-anchor="middle" class="section">SERVICE HLD</text>
  <text x="50" y="112" class="title">DotaRouterService</text>
  <text x="50" y="144" class="subtitle">Configuration selection, router construction, initialization, and public delegation</text>
  <line x1="50" y1="174" x2="1450" y2="174" stroke="#dbe4ee" stroke-width="1.5"/>

  <rect x="50" y="205" width="1400" height="1610" rx="18" class="frame"/>
  <rect x="50" y="205" width="6" height="1610" rx="3" fill="#3157c9"/>
  <text x="85" y="250" class="section">01 / BUILD THE SERVICE</text>
  <text x="85" y="278" class="note">The factory prefers an explicit route tree and falls back to component metadata.</text>

  <rect x="570" y="330" width="360" height="64" class="card entry"/>
  <text x="750" y="370" text-anchor="middle" class="label entry-label">fromComponents(config)</text>

  <rect x="570" y="475" width="360" height="64" class="card decision"/>
  <text x="750" y="515" text-anchor="middle" class="label">routes supplied &amp; non-empty?</text>

  <rect x="1010" y="330" width="360" height="64" class="card process"/>
  <text x="1190" y="370" text-anchor="middle" class="label">use config.routes</text>
  <text x="1190" y="419" text-anchor="middle" class="note">explicit RouteConfig[]</text>

  <rect x="570" y="620" width="360" height="64" class="card decision"/>
  <text x="750" y="660" text-anchor="middle" class="label">components supplied &amp; non-empty?</text>

  <rect x="570" y="765" width="360" height="64" class="card process"/>
  <text x="750" y="805" text-anchor="middle" class="label">prepareConfig(components)</text>
  <text x="750" y="854" text-anchor="middle" class="note">Route metadata → root “/” → addRoute recursion</text>

  <rect x="90" y="765" width="360" height="64" class="card skip"/>
  <text x="270" y="805" text-anchor="middle" class="label">throw Error(...)</text>
  <text x="270" y="854" text-anchor="middle" class="note">elements are required</text>

  <rect x="570" y="940" width="360" height="64" class="card process"/>
  <text x="750" y="980" text-anchor="middle" class="label">new DotaRouterService(...)</text>
  <text x="750" y="1029" text-anchor="middle" class="note">router, routes, error, default, root</text>

  <rect x="570" y="1100" width="360" height="64" class="card process"/>
  <text x="750" y="1140" text-anchor="middle" class="label">service.init()</text>
  <text x="750" y="1189" text-anchor="middle" class="note">constructs the selected router; returns this</text>

  <rect x="570" y="1260" width="360" height="64" class="card process"/>
  <text x="750" y="1300" text-anchor="middle" class="label">new this._router(...)</text>
  <text x="750" y="1349" text-anchor="middle" class="note">routes, errorRoute, defaultRoute, root</text>

  <path d="M 750 394 V 475" class="connector"/>
  <path d="M 930 507 H 970 V 362 H 1010" class="connector"/>
  <text x="952" y="490" class="branch">yes</text>
  <path d="M 750 539 V 620" class="connector"/>
  <text x="770" y="585" class="branch">no</text>
  <path d="M 750 684 V 765" class="connector"/>
  <text x="770" y="732" class="branch">yes</text>
  <path d="M 570 652 H 510 V 797 H 450" class="connector"/>
  <text x="525" y="636" class="branch">no</text>
  <path d="M 1190 394 V 885 H 750 V 940" class="connector"/>
  <path d="M 750 829 V 940" class="connector"/>
  <path d="M 750 1004 V 1100" class="connector"/>
  <path d="M 750 1164 V 1260" class="connector"/>

  <text x="85" y="1470" class="section">02 / PUBLIC ROUTING API</text>
  <text x="85" y="1498" class="note">After initialization, route(path) forwards navigation to the stored router instance.</text>

  <rect x="570" y="1540" width="360" height="64" class="card entry"/>
  <text x="750" y="1580" text-anchor="middle" class="label entry-label">service.route(path)</text>
  <text x="750" y="1629" text-anchor="middle" class="note">public call after init()</text>
  <rect x="570" y="1710" width="360" height="64" class="card process"/>
  <text x="750" y="1750" text-anchor="middle" class="label">this.instance.route(path)</text>
  <text x="750" y="1799" text-anchor="middle" class="note">adapter-specific navigation begins</text>

  <path d="M 750 1324 V 1510 H 750 V 1540" class="connector"/>
  <path d="M 750 1604 V 1710" class="connector"/>

  <rect x="85" y="1860" width="1330" height="100" rx="12" class="lane"/>
  <text x="115" y="1900" class="section">SCOPE</text>
  <text x="220" y="1900" class="note">The selected router owns browser navigation and calls RouterUtils.render().</text>
  <text x="220" y="1927" class="note">See the adapter and RouterUtils HLDs for those downstream flows.</text>
  <text x="85" y="2005" class="source">Source: packages/libs/dota-router/src/DotaRouterService.ts · Types.ts</text>
</svg>
