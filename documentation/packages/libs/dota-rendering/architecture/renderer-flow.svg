<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 3700" width="2400" height="3700" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota Rendering renderer flow</title>
  <desc id="diagram-desc">The renderer lifecycle from public render and update entry points through stable sessions, legacy and template strategies, diff outcomes, durable marker emission, hydration adoption, detached part discovery, nested ranges, and root-bounded DOM commits.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style><![CDATA[
      svg { background: #ffffff; text-rendering: geometricPrecision; }
      text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 36px; font-weight: 700; letter-spacing: -0.025em; }
      .subtitle { font-size: 18px; fill: #526174; }
      .section { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; fill: #334155; }
      .label { font-size: 16px; font-weight: 700; }
      .note { font-size: 14px; fill: #526174; }
      .branch { font-size: 14px; font-weight: 700; fill: #334155; }
      .legend { font-size: 14px; fill: #526174; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .entry { fill: #eef2ff; stroke: #3157c9; }
      .decision { fill: #fffaf0; stroke: #d6a24e; }
      .effect { fill: #f0fdf4; stroke: #9ac7a3; }
      .skip { fill: #f8fafc; stroke: #94a3b8; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .fanin { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .group { fill: none; stroke: #dbe4ee; stroke-width: 2; stroke-dasharray: 10 8; }
      .rail-blue { stroke: #dbe5ff; stroke-width: 10; }
      .rail-violet { stroke: #eadfff; stroke-width: 10; }
      .rail-green { stroke: #dcf3e2; stroke-width: 10; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="2400" height="3700" fill="#ffffff"/>
  <rect x="70" y="48" width="300" height="34" rx="17" fill="#eef2ff"/>
  <text x="220" y="71" text-anchor="middle" class="section" fill="#3157c9">RENDERER LIFECYCLE FLOW</text>
  <text x="70" y="130" class="title">Stable sessions, selected strategies, bounded DOM ownership</text>
  <text x="70" y="168" class="subtitle">Mount, hydration adoption, and updates converge on stable strategy contracts while structured output retains browser parts.</text>

  <!-- 01: Public entries and session routing. -->
  <line x1="50" y1="220" x2="50" y2="920" class="rail-blue"/>
  <path d="M 50 220 H 2350 M 50 920 H 2350" class="group"/>
  <text x="75" y="214" class="section">01 / PUBLIC ENTRIES AND SESSION ROUTING</text>

  <rect x="100" y="300" width="360" height="64" class="card entry"/>
  <text x="280" y="326" text-anchor="middle" class="label">render(root, output)</text>
  <text x="280" y="350" text-anchor="middle" class="note">initial mount entry</text>

  <rect x="100" y="470" width="360" height="64" class="card"/>
  <text x="280" y="509" text-anchor="middle" class="label">new NativeRoot(root)</text>
  <text x="280" y="560" text-anchor="middle" class="note">adapts Element or ShadowRoot ownership</text>

  <rect x="620" y="470" width="400" height="64" class="card"/>
  <text x="820" y="496" text-anchor="middle" class="label">new RenderSession(root, output)</text>
  <text x="820" y="520" text-anchor="middle" class="note">stable public RenderInstance</text>

  <rect x="620" y="650" width="400" height="64" class="card decision"/>
  <text x="820" y="689" text-anchor="middle" class="label">initial output is TemplateResult?</text>

  <rect x="100" y="820" width="360" height="64" class="card skip"/>
  <text x="280" y="846" text-anchor="middle" class="label">new StringStrategy</text>
  <text x="280" y="870" text-anchor="middle" class="note">writes initial legacy HTML immediately</text>

  <rect x="660" y="820" width="360" height="64" class="card"/>
  <text x="840" y="846" text-anchor="middle" class="label">new TemplateStrategy</text>
  <text x="840" y="870" text-anchor="middle" class="note">mounts and retains parsed parts</text>

  <rect x="1450" y="300" width="360" height="64" class="card entry"/>
  <text x="1630" y="339" text-anchor="middle" class="label">patch() / update()</text>
  <text x="1630" y="390" text-anchor="middle" class="note">existing RenderInstance plus next output</text>

  <rect x="1930" y="300" width="360" height="64" class="card"/>
  <text x="2110" y="339" text-anchor="middle" class="label">RenderSession.update</text>

  <rect x="1930" y="470" width="360" height="64" class="card decision"/>
  <text x="2110" y="509" text-anchor="middle" class="label">output kind matches strategy?</text>

  <rect x="1930" y="650" width="360" height="64" class="card effect"/>
  <text x="2110" y="676" text-anchor="middle" class="label">dispose and switch strategy</text>
  <text x="2110" y="700" text-anchor="middle" class="note">required strategy mounts; session identity remains</text>

  <rect x="1450" y="650" width="360" height="64" class="card"/>
  <text x="1630" y="689" text-anchor="middle" class="label">delegate active strategy.update</text>

  <rect x="1930" y="820" width="360" height="64" class="card effect"/>
  <text x="2110" y="859" text-anchor="middle" class="label">replace CommitResult</text>
  <text x="2110" y="910" text-anchor="middle" class="note">old listeners and nested sessions are disposed</text>

  <path d="M 280 364 V 470" class="connector"/>
  <path d="M 460 502 H 620" class="connector"/>
  <path d="M 820 534 V 650" class="connector"/>
  <path d="M 620 682 H 280 V 820" class="connector"/>
  <text x="310" y="666" class="branch">no</text>
  <path d="M 820 714 V 770 H 840 V 820" class="connector"/>
  <text x="840" y="758" class="branch">yes</text>

  <path d="M 1810 332 H 1930" class="connector"/>
  <path d="M 2110 364 V 470" class="connector"/>
  <path d="M 2110 534 V 650" class="connector"/>
  <text x="2130" y="596" class="branch">no</text>
  <path d="M 1930 502 H 1870 V 682 H 1810" class="connector"/>
  <text x="1830" y="486" class="branch">yes</text>
  <path d="M 2110 714 V 820" class="connector"/>

  <!-- 02: Strategy update behavior. -->
  <line x1="50" y1="980" x2="50" y2="1660" class="rail-violet"/>
  <path d="M 50 980 H 2350 M 50 1660 H 2350" class="group"/>
  <text x="75" y="974" class="section">02 / ACTIVE STRATEGY UPDATE</text>

  <rect x="100" y="1060" width="380" height="64" class="card skip"/>
  <text x="290" y="1099" text-anchor="middle" class="label">StringStrategy.update</text>

  <rect x="100" y="1230" width="380" height="64" class="card decision"/>
  <text x="290" y="1269" text-anchor="middle" class="label">legacy output is exactly equal?</text>

  <rect x="580" y="1230" width="300" height="64" class="card skip"/>
  <text x="730" y="1269" text-anchor="middle" class="label">noop</text>

  <rect x="100" y="1400" width="380" height="64" class="card effect"/>
  <text x="290" y="1439" text-anchor="middle" class="label">root.writeHTML(next)</text>
  <text x="290" y="1490" text-anchor="middle" class="note">changed legacy output replaces the boundary</text>

  <rect x="1040" y="1060" width="400" height="64" class="card"/>
  <text x="1240" y="1099" text-anchor="middle" class="label">TemplateStrategy.update</text>

  <rect x="1040" y="1230" width="400" height="64" class="card"/>
  <text x="1240" y="1256" text-anchor="middle" class="label">diff(current output, next)</text>
  <text x="1240" y="1280" text-anchor="middle" class="note">pure comparison returns noop, patch, or replace</text>

  <rect x="1040" y="1400" width="400" height="64" class="card decision"/>
  <text x="1240" y="1439" text-anchor="middle" class="label">diff kind?</text>

  <rect x="1570" y="1400" width="300" height="64" class="card skip"/>
  <text x="1720" y="1439" text-anchor="middle" class="label">noop</text>

  <rect x="1040" y="1560" width="400" height="64" class="card effect"/>
  <text x="1240" y="1586" text-anchor="middle" class="label">patch changed indexes</text>
  <text x="1240" y="1610" text-anchor="middle" class="note">apply each affected RenderPart once</text>

  <rect x="530" y="1560" width="400" height="64" class="card effect"/>
  <text x="730" y="1586" text-anchor="middle" class="label">dispose parts and remount</text>
  <text x="730" y="1610" text-anchor="middle" class="note">static structure changed</text>

  <path d="M 1630 714 V 950 H 290 V 1060" class="connector"/>
  <text x="320" y="1042" class="branch">legacy strategy</text>
  <path d="M 1630 714 V 950 H 1240 V 1060" class="connector"/>
  <text x="1270" y="1042" class="branch">template strategy</text>

  <path d="M 290 1124 V 1230" class="connector"/>
  <path d="M 480 1262 H 580" class="connector"/>
  <text x="510" y="1246" class="branch">yes</text>
  <path d="M 290 1294 V 1400" class="connector"/>
  <text x="310" y="1352" class="branch">no</text>

  <path d="M 1240 1124 V 1230" class="connector"/>
  <path d="M 1240 1294 V 1400" class="connector"/>
  <path d="M 1440 1432 H 1570" class="connector"/>
  <text x="1472" y="1416" class="branch">noop</text>
  <path d="M 1240 1464 V 1560" class="connector"/>
  <text x="1260" y="1518" class="branch">patch</text>
  <path d="M 1040 1432 H 980 V 1592 H 930" class="connector"/>
  <text x="986" y="1416" class="branch">replace</text>

  <!-- Initial legacy constructor converges on writeHTML. -->
  <path d="M 280 884 V 1000 H 60 V 1432 H 100" class="connector"/>

  <!-- 03: Detached template mount and retained parts. -->
  <line x1="50" y1="1720" x2="50" y2="2750" class="rail-green"/>
  <path d="M 50 1720 H 2350 M 50 2750 H 2350" class="group"/>
  <text x="75" y="1714" class="section">03 / TEMPLATE MOUNT, PART DISCOVERY, AND BOUNDED EFFECTS</text>

  <rect x="960" y="1790" width="400" height="64" class="card"/>
  <text x="1160" y="1816" text-anchor="middle" class="label">TemplateStrategy.mount</text>
  <text x="1160" y="1840" text-anchor="middle" class="note">initial structured output or structural replacement</text>

  <rect x="960" y="1960" width="400" height="64" class="card"/>
  <text x="1160" y="1986" text-anchor="middle" class="label">build tokenized template source</text>
  <text x="1160" y="2010" text-anchor="middle" class="note">boundary comments + strings + dota-value-N tokens</text>

  <rect x="960" y="2130" width="400" height="64" class="card"/>
  <text x="1160" y="2156" text-anchor="middle" class="label">parse detached HTMLTemplateElement</text>
  <text x="1160" y="2180" text-anchor="middle" class="note">custom elements are not connected yet</text>

  <rect x="960" y="2300" width="400" height="64" class="card"/>
  <text x="1160" y="2326" text-anchor="middle" class="label">findParts(fragment)</text>
  <text x="1160" y="2350" text-anchor="middle" class="note">DOM traversal converts tokens into runtime records</text>

  <rect x="160" y="2470" width="400" height="64" class="card"/>
  <text x="360" y="2496" text-anchor="middle" class="label">ChildPart boundaries</text>
  <text x="360" y="2520" text-anchor="middle" class="note">scalar text · conditional session · keyed ranges</text>

  <rect x="760" y="2470" width="400" height="64" class="card"/>
  <text x="960" y="2496" text-anchor="middle" class="label">AttributePart records</text>
  <text x="960" y="2520" text-anchor="middle" class="note">attribute · boolean · property · event modes</text>

  <rect x="1360" y="2470" width="400" height="64" class="card"/>
  <text x="1560" y="2496" text-anchor="middle" class="label">element diagnostics</text>
  <text x="1560" y="2520" text-anchor="middle" class="note">index · dynamic marker · custom-element host</text>

  <rect x="1880" y="2470" width="400" height="64" class="card"/>
  <text x="2080" y="2496" text-anchor="middle" class="label">nested range ownership</text>
  <text x="2080" y="2520" text-anchor="middle" class="note">keyed and conditional RangeRoot sessions</text>

  <rect x="760" y="2640" width="400" height="64" class="card"/>
  <text x="960" y="2666" text-anchor="middle" class="label">applyIndexes(values)</text>
  <text x="960" y="2690" text-anchor="middle" class="note">all indexes initially; changed indexes for patches</text>

  <rect x="1360" y="2640" width="400" height="64" class="card effect"/>
  <text x="1560" y="2666" text-anchor="middle" class="label">root-bounded DOM commit</text>
  <text x="1560" y="2690" text-anchor="middle" class="note">attach prepared fragment or patch retained nodes</text>

  <path d="M 840 884 V 940 H 500 V 1680 H 1160 V 1790" class="connector"/>
  <path d="M 730 1624 V 1680 H 1160 V 1790" class="connector"/>
  <path d="M 1160 1854 V 1960" class="connector"/>
  <path d="M 1160 2024 V 2130" class="connector"/>
  <path d="M 1160 2194 V 2300" class="connector"/>

  <path d="M 1160 2364 V 2410 H 360 V 2470" class="connector"/>
  <path d="M 1160 2364 V 2410 H 960 V 2470" class="connector"/>
  <path d="M 1160 2364 V 2410 H 1560 V 2470" class="connector"/>
  <path d="M 560 2502 H 650 V 2600 H 2080 V 2470" class="connector"/>

  <path d="M 360 2534 V 2585 H 960" class="fanin"/>
  <path d="M 960 2534 V 2640" class="connector"/>
  <path d="M 1560 2534 V 2585 H 960" class="fanin"/>
  <circle cx="960" cy="2585" r="7" fill="#94a3b8"/>

  <!-- Patch path uses the outer and footer corridors, then enters applyIndexes from below. -->
  <path d="M 1240 1624 V 1680 H 2320 V 2730 H 960 V 2704" class="connector"/>
  <path d="M 1160 2672 H 1360" class="connector"/>

  <rect x="70" y="2790" width="18" height="18" rx="4" class="entry"/>
  <text x="100" y="2805" class="legend">public entry</text>
  <rect x="260" y="2790" width="18" height="18" rx="4" class="decision"/>
  <text x="290" y="2805" class="legend">strategy or diff decision</text>
  <rect x="600" y="2790" width="18" height="18" rx="4" class="effect"/>
  <text x="630" y="2805" class="legend">commit or observable result</text>
  <rect x="940" y="2790" width="18" height="18" rx="4" class="skip"/>
  <text x="970" y="2805" class="legend">legacy or no-op path</text>
  <path d="M 1260 2799 H 1320" class="connector"/>
  <text x="1340" y="2805" class="legend">synchronous control flow</text>
  <path d="M 1690 2799 H 1750" class="fanin"/>
  <text x="1770" y="2805" class="legend">part-discovery fan-in</text>

  <!-- 04: Durable markers and hydration adoption. -->
  <line x1="50" y1="2900" x2="50" y2="3540" class="rail-violet"/>
  <path d="M 50 2900 H 2350 M 50 3540 H 2350" class="group"/>
  <text x="75" y="2894" class="section">04 / DURABLE MARKERS AND HYDRATION ADOPTION</text>
  <text x="75" y="2924" class="note">Build-time marker emission is opt-in. Hydration reconstructs in-memory parts over validated server DOM without replacing the owned root.</text>

  <rect x="140" y="3000" width="380" height="64" class="card entry"/>
  <text x="330" y="3039" text-anchor="middle" class="label">setHydrationEmit(true)</text>
  <rect x="140" y="3170" width="380" height="64" class="card effect"/>
  <text x="330" y="3196" text-anchor="middle" class="label">TemplateStrategy.mount</text>
  <text x="330" y="3220" text-anchor="middle" class="note">durable child/keyed comments + attribute part tokens</text>
  <rect x="620" y="3170" width="380" height="64" class="card effect"/>
  <text x="810" y="3196" text-anchor="middle" class="label">stamp host template identity</text>
  <text x="810" y="3220" text-anchor="middle" class="note">data-dh-c · data-dh-t · data-dh-v</text>

  <rect x="1180" y="3000" width="380" height="64" class="card entry"/>
  <text x="1370" y="3039" text-anchor="middle" class="label">hydrate(root, TemplateResult)</text>
  <rect x="1180" y="3170" width="380" height="64" class="card decision"/>
  <text x="1370" y="3209" text-anchor="middle" class="label">structured output?</text>
  <rect x="1180" y="3340" width="380" height="64" class="card"/>
  <text x="1370" y="3366" text-anchor="middle" class="label">TemplateStrategy.adopt</text>
  <text x="1370" y="3390" text-anchor="middle" class="note">parse plan + bind durable live markers to retained parts</text>
  <rect x="1700" y="3170" width="380" height="64" class="card skip"/>
  <text x="1890" y="3209" text-anchor="middle" class="label">throw TypeError</text>
  <text x="1890" y="3258" text-anchor="middle" class="note">legacy output cannot hydrate</text>
  <rect x="1700" y="3340" width="380" height="64" class="card effect"/>
  <text x="1890" y="3366" text-anchor="middle" class="label">ordinary later patch()</text>
  <text x="1890" y="3390" text-anchor="middle" class="note">adopted DOM nodes retain identity</text>

  <rect x="620" y="3470" width="380" height="64" class="card"/>
  <text x="810" y="3509" text-anchor="middle" class="label">setHydrationEmit(false)</text>
  <text x="810" y="3558" text-anchor="middle" class="note">later structural mount clears stale host identity</text>

  <path d="M 330 3064 V 3170" class="connector"/>
  <path d="M 520 3202 H 620" class="connector"/>
  <path d="M 1370 3064 V 3170" class="connector"/>
  <path d="M 1560 3202 H 1700" class="connector"/>
  <text x="1585" y="3186" class="branch">no</text>
  <path d="M 1370 3234 V 3340" class="connector"/>
  <text x="1390" y="3292" class="branch">yes</text>
  <path d="M 1560 3372 H 1700" class="connector"/>
  <path d="M 810 3234 V 3470" class="connector"/>

  <text x="75" y="3630" class="source">Hydration source: packages/libs/dota-rendering/src/renderer.ts · template-id.ts</text>
</svg>
