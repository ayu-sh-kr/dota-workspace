<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1040" width="1800" height="1040" role="img" aria-labelledby="title desc">
  <title id="title">Scoped hydration marker ownership</title>
  <desc id="desc">Current nested hydration can adopt a child component's local part marker and remount. The proposed marker scope makes each component adopt only its own markers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <style><![CDATA[
      text{font-family:"DM Sans","Poppins",Helvetica,Arial,sans-serif;fill:#1f2937}.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#526174}.section{font-size:18px;font-weight:700;letter-spacing:.05em;fill:#334155}.label{font-size:16px;font-weight:700}.note{font-size:14px;fill:#526174}.branch{font-size:14px;font-weight:700;fill:#334155}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:10}.entry{fill:#eef2ff;stroke:#3157c9}.decision{fill:#fffaf0;stroke:#d6a24e}.effect{fill:#f0fdf4;stroke:#9ac7a3}.skip{fill:#f8fafc;stroke:#94a3b8}.connector{fill:none;stroke:#64748b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.boundary{stroke:#dbe4ee;stroke-width:1.5;stroke-dasharray:8 8}
    ]]></style>
  </defs>
  <rect width="1800" height="1040" fill="#fff"/>
  <text x="70" y="86" class="title">Scoped hydration marker ownership</text>
  <text x="70" y="122" class="subtitle">A renderer-level proposal: fix marker identity once, rather than reconstructing component DOM or state.</text>

  <text x="70" y="192" class="section">CURRENT FAILURE</text>
  <path d="M70 214 H1730" class="boundary"/>
  <rect x="90" y="280" width="290" height="74" class="card entry"/>
  <text x="235" y="311" text-anchor="middle" class="label">SSG emits local markers</text>
  <text x="235" y="335" text-anchor="middle" class="note">parent p2 · child p2</text>
  <rect x="550" y="280" width="290" height="74" class="card"/>
  <text x="695" y="311" text-anchor="middle" class="label">parent scans descendants</text>
  <text x="695" y="335" text-anchor="middle" class="note">NativeRoot.hydrationNodes()</text>
  <rect x="1010" y="280" width="290" height="74" class="card decision"/>
  <text x="1155" y="311" text-anchor="middle" class="label">wrong p2 adopted</text>
  <text x="1155" y="335" text-anchor="middle" class="note">marker has no owner</text>
  <rect x="1470" y="280" width="250" height="74" class="card skip"/>
  <text x="1595" y="311" text-anchor="middle" class="label">warn recovery</text>
  <text x="1595" y="335" text-anchor="middle" class="note">parent remounts</text>
  <path d="M380 317 H550 M840 317 H1010 M1300 317 H1470" class="connector"/>

  <text x="70" y="510" class="section">PROPOSED DURABLE FORMAT · MARKER VERSION 2</text>
  <path d="M70 532 H1730" class="boundary"/>
  <rect x="90" y="600" width="290" height="74" class="card entry"/>
  <text x="235" y="631" text-anchor="middle" class="label">SSG assigns scope</text>
  <text x="235" y="655" text-anchor="middle" class="note">host data-dh-s="h42"</text>
  <rect x="550" y="600" width="290" height="74" class="card"/>
  <text x="695" y="631" text-anchor="middle" class="label">emit qualified markers</text>
  <text x="695" y="655" text-anchor="middle" class="note">dh:h42:p2 · h42:p1</text>
  <rect x="1010" y="600" width="290" height="74" class="card decision"/>
  <text x="1155" y="631" text-anchor="middle" class="label">scope matches host?</text>
  <text x="1155" y="655" text-anchor="middle" class="note">filter comments and attributes</text>
  <rect x="1470" y="600" width="250" height="74" class="card effect"/>
  <text x="1595" y="631" text-anchor="middle" class="label">adopt in place</text>
  <text x="1595" y="655" text-anchor="middle" class="note">child owns h43 markers</text>
  <path d="M380 637 H550 M840 637 H1010 M1300 637 H1470" class="connector"/>
  <text x="1350" y="620" class="branch">yes</text>
  <path d="M1155 674 V750 H1420" class="connector"/>
  <text x="1180" y="727" class="branch">no: ordinary recovery</text>

  <rect x="90" y="820" width="1630" height="110" class="card"/>
  <text x="120" y="855" class="label">Ownership boundary</text>
  <text x="120" y="886" class="note">Dota Rendering emits, stamps, parses, and filters scoped markers. Dota SSR validates host eligibility and rejects old version-1 output safely. BaseElement and application components do not compare or reconstruct initial innerHTML.</text>
  <text x="70" y="985" class="note">Source: packages/libs/dota-rendering/src/renderer.ts · proposal: documentation/packages/libs/dota-rendering/planning/scoped-hydration-marker-ownership.md</text>
</svg>
