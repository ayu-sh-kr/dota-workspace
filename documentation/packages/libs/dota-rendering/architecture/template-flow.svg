<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1660" width="1600" height="1660" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota Rendering template processing flow</title>
  <desc id="diagram-desc">How the html tagged template chooses its fast path, reuses or invalidates a flattening plan, recursively normalizes structural values, and returns a canonical TemplateResult.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style><![CDATA[
      svg { background: #ffffff; text-rendering: geometricPrecision; }
      text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 36px; font-weight: 700; letter-spacing: -0.025em; }
      .subtitle { font-size: 18px; fill: #526174; }
      .section { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; fill: #334155; }
      .label { font-size: 16px; font-weight: 700; }
      .note { font-size: 14px; fill: #526174; }
      .branch { font-size: 14px; font-weight: 700; fill: #334155; }
      .legend { font-size: 14px; fill: #526174; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .entry { fill: #eef2ff; stroke: #3157c9; }
      .decision { fill: #fffaf0; stroke: #d6a24e; }
      .effect { fill: #f0fdf4; stroke: #9ac7a3; }
      .skip { fill: #f8fafc; stroke: #94a3b8; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .fanin { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .group { fill: none; stroke: #dbe4ee; stroke-width: 2; stroke-dasharray: 10 8; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1600" height="1660" fill="#ffffff"/>
  <rect x="60" y="46" width="330" height="34" rx="17" fill="#eef2ff"/>
  <text x="225" y="69" text-anchor="middle" class="section" fill="#3157c9">TEMPLATE NORMALIZATION FLOW</text>
  <text x="60" y="128" class="title">html(strings, ...values)</text>
  <text x="60" y="166" class="subtitle">Composition is normalized before diffing so nested dynamic leaves share one patchable index space.</text>

  <!-- Optional directive producers fan into the tagged-template entry. -->
  <rect x="70" y="230" width="320" height="64" class="card entry"/>
  <text x="230" y="269" text-anchor="middle" class="label">unsafeHTML(markup)</text>
  <text x="230" y="320" text-anchor="middle" class="note">trusted markup becomes structural input</text>

  <rect x="600" y="230" width="400" height="64" class="card entry"/>
  <text x="800" y="256" text-anchor="middle" class="label">html(strings, ...values)</text>
  <text x="800" y="280" text-anchor="middle" class="note">no DOM side effects</text>

  <rect x="1210" y="230" width="320" height="64" class="card entry"/>
  <text x="1370" y="269" text-anchor="middle" class="label">keyed() / when()</text>
  <text x="1370" y="320" text-anchor="middle" class="note">remain dynamic values for renderer ranges</text>

  <path d="M 390 262 H 600" class="connector"/>
  <path d="M 1210 262 H 1000" class="connector"/>

  <!-- Main decision spine: x=600,w=400,h=64. -->
  <rect x="600" y="410" width="400" height="64" class="card decision"/>
  <text x="800" y="436" text-anchor="middle" class="label">any structural value?</text>
  <text x="800" y="460" text-anchor="middle" class="note">nested template · structural array · unsafe HTML</text>

  <rect x="1130" y="410" width="400" height="64" class="card effect"/>
  <text x="1330" y="449" text-anchor="middle" class="label">return original TemplateResult</text>
  <text x="1330" y="500" text-anchor="middle" class="note">fast path keeps original strings and values</text>

  <rect x="600" y="580" width="400" height="64" class="card decision"/>
  <text x="800" y="606" text-anchor="middle" class="label">cached plan exists and shape matches?</text>
  <text x="800" y="630" text-anchor="middle" class="note">nested strings identity · array shape · exact trusted markup</text>

  <rect x="1130" y="580" width="400" height="64" class="card effect"/>
  <text x="1330" y="619" text-anchor="middle" class="label">reuse flattened strings</text>
  <text x="1330" y="670" text-anchor="middle" class="note">collect only the current ordinary leaf values</text>

  <rect x="600" y="750" width="400" height="64" class="card"/>
  <text x="800" y="776" text-anchor="middle" class="label">appendFlattenedValue(value)</text>
  <text x="800" y="800" text-anchor="middle" class="note">recursive dispatch builds strings, values, and shapes</text>

  <path d="M 800 294 V 410" class="connector"/>
  <path d="M 1000 442 H 1130" class="connector"/>
  <text x="1030" y="426" class="branch">no</text>
  <path d="M 800 474 V 580" class="connector"/>
  <text x="820" y="532" class="branch">yes</text>
  <path d="M 1000 612 H 1130" class="connector"/>
  <text x="1030" y="596" class="branch">yes</text>
  <path d="M 800 644 V 750" class="connector"/>
  <text x="820" y="702" class="branch">no or mismatch</text>

  <!-- Recursive shape outcomes. Geometry uses four 300x64 cards with 80px gaps. -->
  <path d="M 800 814 V 880 H 220 V 930" class="connector"/>
  <path d="M 800 814 V 880 H 600 V 930" class="connector"/>
  <path d="M 800 814 V 880 H 980 V 930" class="connector"/>
  <path d="M 800 814 V 880 H 1360 V 930" class="connector"/>

  <rect x="70" y="930" width="300" height="64" class="card"/>
  <text x="220" y="956" text-anchor="middle" class="label">nested TemplateResult</text>
  <text x="220" y="980" text-anchor="middle" class="note">merge strings and recurse through values</text>

  <rect x="450" y="930" width="300" height="64" class="card"/>
  <text x="600" y="956" text-anchor="middle" class="label">UnsafeHtmlValue</text>
  <text x="600" y="980" text-anchor="middle" class="note">merge exact markup into static strings</text>

  <rect x="830" y="930" width="300" height="64" class="card"/>
  <text x="980" y="956" text-anchor="middle" class="label">structural array</text>
  <text x="980" y="980" text-anchor="middle" class="note">recurse through items in source order</text>

  <rect x="1210" y="930" width="300" height="64" class="card"/>
  <text x="1360" y="956" text-anchor="middle" class="label">ordinary dynamic value</text>
  <text x="1360" y="980" text-anchor="middle" class="note">append one leaf value and a string gap</text>

  <rect x="600" y="1160" width="400" height="64" class="card"/>
  <text x="800" y="1186" text-anchor="middle" class="label">complete flattened accumulator</text>
  <text x="800" y="1210" text-anchor="middle" class="note">static segments · dynamic leaves · recursive shapes</text>

  <path d="M 220 994 V 1090 H 800" class="fanin"/>
  <path d="M 600 994 V 1090 H 800" class="fanin"/>
  <path d="M 980 994 V 1090 H 800" class="fanin"/>
  <path d="M 1360 994 V 1090 H 800" class="fanin"/>
  <circle cx="800" cy="1090" r="7" fill="#94a3b8"/>
  <path d="M 800 1090 V 1160" class="connector"/>

  <rect x="600" y="1330" width="400" height="64" class="card"/>
  <text x="800" y="1356" text-anchor="middle" class="label">create TemplateStringsArray.raw</text>
  <text x="800" y="1380" text-anchor="middle" class="note">cache latest plan in WeakMap by outer call site</text>

  <rect x="600" y="1500" width="400" height="64" class="card effect"/>
  <text x="800" y="1539" text-anchor="middle" class="label">return canonical TemplateResult</text>
  <text x="800" y="1590" text-anchor="middle" class="note">renderer receives one static structure and leaf-value index space</text>

  <path d="M 800 1224 V 1330" class="connector"/>
  <path d="M 800 1394 V 1500" class="connector"/>

  <rect x="60" y="1620" width="18" height="18" rx="4" class="entry"/>
  <text x="90" y="1635" class="legend">helper or template entry</text>
  <rect x="310" y="1620" width="18" height="18" rx="4" class="decision"/>
  <text x="340" y="1635" class="legend">cache or structure decision</text>
  <rect x="660" y="1620" width="18" height="18" rx="4" class="effect"/>
  <text x="690" y="1635" class="legend">returned output</text>
  <path d="M 930 1629 H 990" class="connector"/>
  <text x="1010" y="1635" class="legend">synchronous normalization</text>
  <path d="M 1270 1629 H 1330" class="fanin"/>
  <text x="1350" y="1635" class="legend">recursive fan-in</text>
</svg>
