<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1580" width="1800" height="1580" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota Rendering overall architecture</title>
  <desc id="diagram-desc">The source-backed ownership flow from Dota Core render output through template normalization, public rendering APIs, stable render sessions, strategies, roots, parts, and DOM effects.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style><![CDATA[
      svg { background: #ffffff; text-rendering: geometricPrecision; }
      text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 36px; font-weight: 700; letter-spacing: -0.025em; }
      .subtitle { font-size: 18px; fill: #526174; }
      .group-title { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; fill: #334155; }
      .label { font-size: 16px; font-weight: 700; }
      .note { font-size: 14px; fill: #526174; }
      .branch { font-size: 14px; font-weight: 700; fill: #334155; }
      .legend { font-size: 14px; fill: #526174; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .entry { fill: #eef2ff; stroke: #3157c9; }
      .decision { fill: #fffaf0; stroke: #d6a24e; }
      .effect { fill: #f0fdf4; stroke: #9ac7a3; }
      .skip { fill: #f8fafc; stroke: #94a3b8; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .group { fill: none; stroke: #dbe4ee; stroke-width: 2; stroke-dasharray: 10 8; }
      .rail-blue { stroke: #dbe5ff; stroke-width: 10; }
      .rail-violet { stroke: #eadfff; stroke-width: 10; }
      .rail-green { stroke: #dcf3e2; stroke-width: 10; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1800" height="1580" fill="#ffffff"/>
  <rect x="70" y="48" width="340" height="34" rx="17" fill="#eef2ff"/>
  <text x="240" y="71" text-anchor="middle" class="group-title" fill="#3157c9">DOTA RENDERING · ARCHITECTURE</text>
  <text x="70" y="130" class="title">From render output to owned DOM mutations</text>
  <text x="70" y="168" class="subtitle">Pure output description and comparison feed a stable session whose strategy commits through an explicit root boundary.</text>

  <!-- Public pipeline geometry: Core 70,240,300,64; output 470,240,300,64; API 870,240,300,64; session 1270,240,360,64. -->
  <line x1="50" y1="218" x2="50" y2="370" class="rail-blue"/>
  <path d="M 50 218 H 1750 M 50 370 H 1750" class="group"/>
  <text x="70" y="212" class="group-title">01 / PUBLIC OWNERSHIP PIPELINE</text>

  <rect x="70" y="250" width="300" height="64" class="card entry"/>
  <text x="220" y="289" text-anchor="middle" class="label">Dota Core lifecycle</text>
  <text x="220" y="340" text-anchor="middle" class="note">produces the next component output</text>

  <rect x="470" y="250" width="300" height="64" class="card"/>
  <text x="620" y="289" text-anchor="middle" class="label">RenderOutput</text>
  <text x="620" y="340" text-anchor="middle" class="note">string · TemplateResult · nothing</text>

  <rect x="870" y="250" width="300" height="64" class="card entry"/>
  <text x="1020" y="289" text-anchor="middle" class="label">render / patch / update</text>
  <text x="1020" y="340" text-anchor="middle" class="note">the only public DOM commit entry points</text>

  <rect x="1270" y="250" width="360" height="64" class="card"/>
  <text x="1450" y="276" text-anchor="middle" class="label">RenderSession</text>
  <text x="1450" y="300" text-anchor="middle" class="note">stable instance identity and output baseline</text>

  <path d="M 370 282 H 470" class="connector"/>
  <path d="M 770 282 H 870" class="connector"/>
  <path d="M 1170 282 H 1270" class="connector"/>

  <!-- Composition group. -->
  <line x1="50" y1="430" x2="50" y2="760" class="rail-violet"/>
  <path d="M 50 430 H 840 M 50 760 H 840" class="group"/>
  <text x="70" y="424" class="group-title">02 / OUTPUT DESCRIPTION</text>

  <rect x="90" y="500" width="300" height="64" class="card entry"/>
  <text x="240" y="539" text-anchor="middle" class="label">html(strings, ...values)</text>
  <text x="240" y="590" text-anchor="middle" class="note">pure template composition</text>

  <rect x="490" y="500" width="300" height="64" class="card"/>
  <text x="640" y="526" text-anchor="middle" class="label">flatten nested structure</text>
  <text x="640" y="550" text-anchor="middle" class="note">reuse WeakMap plan when the shape matches</text>

  <rect x="490" y="660" width="300" height="64" class="card effect"/>
  <text x="640" y="699" text-anchor="middle" class="label">TemplateResult</text>
  <text x="640" y="750" text-anchor="middle" class="note">canonical strings plus patchable leaf values</text>

  <rect x="90" y="660" width="300" height="64" class="card skip"/>
  <text x="240" y="699" text-anchor="middle" class="label">legacy string output</text>
  <text x="240" y="750" text-anchor="middle" class="note">bypasses template metadata</text>

  <path d="M 390 532 H 490" class="connector"/>
  <path d="M 640 564 V 660" class="connector"/>
  <path d="M 790 692 H 820 V 390 H 620 V 314" class="connector"/>
  <path d="M 240 660 V 620 H 420 V 390 H 620 V 314" class="connector"/>

  <!-- Strategy group. -->
  <line x1="900" y1="430" x2="900" y2="1190" class="rail-green"/>
  <path d="M 900 430 H 1750 M 900 1190 H 1750" class="group"/>
  <text x="920" y="424" class="group-title">03 / SESSION STRATEGY AND COMMIT</text>

  <rect x="1270" y="480" width="360" height="64" class="card decision"/>
  <text x="1450" y="519" text-anchor="middle" class="label">current output kind?</text>
  <path d="M 1450 314 V 480" class="connector"/>

  <rect x="940" y="660" width="320" height="64" class="card skip"/>
  <text x="1100" y="686" text-anchor="middle" class="label">StringStrategy</text>
  <text x="1100" y="710" text-anchor="middle" class="note">equal → noop · changed → writeHTML</text>

  <rect x="1390" y="660" width="320" height="64" class="card"/>
  <text x="1550" y="686" text-anchor="middle" class="label">TemplateStrategy</text>
  <text x="1550" y="710" text-anchor="middle" class="note">owns parts, listeners, and nested sessions</text>

  <path d="M 1270 512 H 1100 V 660" class="connector"/>
  <text x="1130" y="496" class="branch">legacy</text>
  <path d="M 1450 544 V 610 H 1550 V 660" class="connector"/>
  <text x="1470" y="594" class="branch">structured</text>

  <rect x="940" y="860" width="320" height="64" class="card"/>
  <text x="1100" y="886" text-anchor="middle" class="label">NativeRoot / RangeRoot</text>
  <text x="1100" y="910" text-anchor="middle" class="note">whole component or bounded sibling ownership</text>

  <rect x="1390" y="840" width="320" height="64" class="card"/>
  <text x="1550" y="866" text-anchor="middle" class="label">diff(previous, next)</text>
  <text x="1550" y="890" text-anchor="middle" class="note">pure noop · patch · replace selection</text>

  <rect x="1390" y="1020" width="320" height="64" class="card"/>
  <text x="1550" y="1046" text-anchor="middle" class="label">RenderPart registry</text>
  <text x="1550" y="1070" text-anchor="middle" class="note">child ranges and parsed browser bindings</text>

  <path d="M 1100 724 V 860" class="connector"/>
  <path d="M 1550 724 V 840" class="connector"/>
  <path d="M 1550 904 V 1020" class="connector"/>
  <path d="M 1390 1052 H 1320 V 892 H 1260" class="connector"/>

  <!-- Nested ownership and final effect. -->
  <line x1="50" y1="1230" x2="50" y2="1450" class="rail-violet"/>
  <path d="M 50 1230 H 1750 M 50 1450 H 1750" class="group"/>
  <text x="70" y="1224" class="group-title">04 / BOUNDED EFFECTS AND NESTED OWNERSHIP</text>

  <rect x="90" y="1290" width="360" height="64" class="card"/>
  <text x="270" y="1329" text-anchor="middle" class="label">keyed() / when()</text>
  <text x="270" y="1380" text-anchor="middle" class="note">explicit collection and branch identity</text>

  <rect x="560" y="1290" width="360" height="64" class="card"/>
  <text x="740" y="1329" text-anchor="middle" class="label">nested RangeRoot + session</text>
  <text x="740" y="1380" text-anchor="middle" class="note">patches only siblings inside text boundaries</text>

  <rect x="1030" y="1290" width="300" height="64" class="card effect"/>
  <text x="1180" y="1329" text-anchor="middle" class="label">owned DOM mutation</text>
  <text x="1180" y="1380" text-anchor="middle" class="note">replace, text, attribute, property, or event</text>

  <rect x="1430" y="1290" width="300" height="64" class="card effect"/>
  <text x="1580" y="1329" text-anchor="middle" class="label">CommitResult</text>
  <text x="1580" y="1380" text-anchor="middle" class="note">kind · changedParts · replacedNodes</text>

  <path d="M 450 1322 H 560" class="connector"/>
  <path d="M 920 1322 H 1030" class="connector"/>
  <path d="M 1330 1322 H 1430" class="connector"/>
  <path d="M 1100 924 V 1160 H 1180 V 1290" class="connector"/>
  <path d="M 1550 1084 V 1160 H 1180 V 1290" class="connector"/>

  <!-- Legend. -->
  <rect x="70" y="1500" width="18" height="18" rx="4" class="entry"/>
  <text x="100" y="1515" class="legend">public entry or producer</text>
  <rect x="340" y="1500" width="18" height="18" rx="4" class="card"/>
  <text x="370" y="1515" class="legend">processing or ownership boundary</text>
  <rect x="750" y="1500" width="18" height="18" rx="4" class="decision"/>
  <text x="780" y="1515" class="legend">strategy decision</text>
  <rect x="1040" y="1500" width="18" height="18" rx="4" class="effect"/>
  <text x="1070" y="1515" class="legend">observable result or DOM effect</text>
  <path d="M 1430 1509 H 1490" class="connector"/>
  <text x="1510" y="1515" class="legend">synchronous ownership flow</text>
</svg>
