<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2050" width="2000" height="2050" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota SSR browser hydration runtime flow</title><desc id="diagram-desc">Source-backed flow for the dotaHydration runtime plugin: marked component adoption, mismatch recovery or strict errors, initial marked route host preservation, and HYDRATED lifecycle event emission before CONNECTED when hydrate() succeeds.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><style><![CDATA[
svg{background:#fff;text-rendering:geometricPrecision}text{font-family:"DM Sans","Poppins",Helvetica,Arial,sans-serif;fill:#1f2937}.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#526174}.section{font-size:18px;font-weight:700;letter-spacing:.05em;fill:#334155}.label{font-size:16px;font-weight:700}.annotation{font-size:14px;fill:#526174}.branch{font-size:14px;font-weight:700;fill:#334155}.legend{font-size:14px;fill:#526174}.source{font-size:13px;fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:10}.entry{fill:#eef2ff;stroke:#3157c9}.decision{fill:#fffaf0;stroke:#d6a24e}.effect{fill:#f0fdf4;stroke:#9ac7a3}.skip{fill:#f8fafc;stroke:#94a3b8}.connector{fill:none;stroke:#64748b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.rail{fill:#3157c9}.boundary{fill:none;stroke:#dbe4ee;stroke-width:1.5;stroke-dasharray:8 8}
]]></style></defs>
  <rect width="2000" height="2050" fill="#fff"/><rect x="80" y="52" width="278" height="34" rx="17" fill="#eef2ff"/><text x="219" y="75" text-anchor="middle" class="section" fill="#3157c9">HYDRATION RUNTIME FLOW</text><text x="80" y="132" class="title">Dota SSR · browser adoption and recovery</text><text x="80" y="168" class="subtitle">The opt-in runtime changes only marked initial mounts and marked initial route hosts; all other behavior delegates to the existing Dota runtime.</text><rect x="80" y="193" width="1840" height="6" rx="3" fill="#dbe4ee"/>
  <rect x="60" y="230" width="1880" height="1000" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="60" y="230" width="12" height="1000" rx="6" class="rail"/><text x="100" y="278" class="section">01 / COMPONENT MOUNT STRATEGY</text><text x="100" y="307" class="annotation">Installed through Dota Wrap's runtime sockets when `initializeApp({plugins: [dotaHydration()]})` runs.</text><path d="M100 332 H1900" class="boundary"/>
  <rect x="810" y="390" width="380" height="72" class="card entry"/><text x="1000" y="434" text-anchor="middle" class="label">dotaHydration(options)</text><rect x="810" y="570" width="380" height="72" class="card"/><text x="1000" y="614" text-anchor="middle" class="label">Core invokes mount strategy</text><rect x="810" y="750" width="380" height="72" class="card decision"/><text x="1000" y="794" text-anchor="middle" class="label">hydration markers present?</text><rect x="280" y="930" width="380" height="72" class="card effect"/><text x="470" y="974" text-anchor="middle" class="label">normal mountRender()</text><rect x="810" y="930" width="380" height="72" class="card decision"/><text x="1000" y="974" text-anchor="middle" class="label">template ID + marker version match?</text><rect x="1320" y="930" width="380" height="72" class="card effect"/><text x="1510" y="974" text-anchor="middle" class="label">hydrate existing server DOM</text><rect x="810" y="1110" width="380" height="72" class="card decision"/><text x="1000" y="1154" text-anchor="middle" class="label">mismatch policy is throw?</text><rect x="280" y="1290" width="380" height="72" class="card skip"/><text x="470" y="1334" text-anchor="middle" class="label">throw host-scoped error</text><rect x="810" y="1290" width="380" height="72" class="card effect"/><text x="1000" y="1334" text-anchor="middle" class="label">remove markers + mountRender()</text><text x="1000" y="1384" text-anchor="middle" class="annotation">default recover policy; only mismatched host remounts</text>
  <path d="M1000 462V570" class="connector"/><path d="M1000 642V750" class="connector"/><path d="M810 786H740V966H660" class="connector"/><text x="755" y="770" class="branch">no</text><path d="M1000 822V930" class="connector"/><text x="1020" y="878" class="branch">yes</text><path d="M1190 966H1320" class="connector"/><text x="1212" y="950" class="branch">yes</text><path d="M1510 1002V1100" class="connector"/><path d="M1000 1002V1110" class="connector"/><text x="1020" y="1058" class="branch">no</text><path d="M810 1146H740V1326H660" class="connector"/><text x="755" y="1130" class="branch">yes</text><path d="M1000 1182V1290" class="connector"/><text x="1020" y="1238" class="branch">no / recover</text>
  <rect x="1320" y="1100" width="380" height="72" class="card effect"/><text x="1510" y="1144" text-anchor="middle" class="label">emit HYDRATED lifecycle event</text>
  <text x="1510" y="1188" text-anchor="middle" class="annotation">mountResult.hydrated === true → Core emits before CONNECTED</text>
  <rect x="60" y="1480" width="1880" height="390" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="60" y="1480" width="12" height="390" rx="6" fill="#7c3aed"/><text x="100" y="1528" class="section">02 / INITIAL ROUTE HOST PRESERVATION</text><text x="100" y="1557" class="annotation">A second independent registration decorates only router presentation, preserving a server-rendered page when it agrees with the selected first route.</text>
  <rect x="810" y="1620" width="380" height="72" class="card entry"/><text x="1000" y="1664" text-anchor="middle" class="label">router renderer called</text><rect x="810" y="1780" width="380" height="72" class="card decision"/><text x="1000" y="1824" text-anchor="middle" class="label">initial marked page matches pathname?</text><rect x="1320" y="1780" width="380" height="72" class="card effect"/><text x="1510" y="1824" text-anchor="middle" class="label">preserve server page host</text><rect x="280" y="1780" width="380" height="72" class="card"/><text x="470" y="1824" text-anchor="middle" class="label">delegate normal router renderer</text><path d="M1000 1692V1780" class="connector"/><path d="M810 1816H660" class="connector"/><text x="735" y="1800" class="branch">no / later navigation / custom render</text><path d="M1190 1816H1320" class="connector"/><text x="1212" y="1800" class="branch">yes</text>
  <rect x="60" y="1930" width="1880" height="1" fill="#e2e8f0"/><rect x="100" y="1960" width="34" height="20" rx="5" class="card entry"/><text x="148" y="1976" class="legend">entry</text><rect x="300" y="1960" width="34" height="20" rx="5" class="card"/><text x="348" y="1976" class="legend">process</text><rect x="500" y="1960" width="34" height="20" rx="5" class="card decision"/><text x="548" y="1976" class="legend">guard</text><rect x="680" y="1960" width="34" height="20" rx="5" class="card effect"/><text x="728" y="1976" class="legend">DOM effect</text><text x="1050" y="1976" class="source">Source: packages/libs/dota-ssr/src/index.ts</text>
</svg>
