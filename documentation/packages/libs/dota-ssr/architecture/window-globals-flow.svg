<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1960" width="2000" height="1960" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota SSR happy-dom global bridge</title>
  <desc id="diagram-desc">Source-backed flow for installing a route-specific happy-dom window on globalThis and restoring each original descriptor after prerendering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <style><![CDATA[
      svg { background:#fff; text-rendering:geometricPrecision; }
      text { font-family:"DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill:#1f2937; }
      .title { font-size:34px; font-weight:700; letter-spacing:-.025em; }
      .subtitle { font-size:18px; fill:#526174; }
      .section { font-size:18px; font-weight:700; letter-spacing:.05em; fill:#334155; }
      .label { font-size:16px; font-weight:700; }
      .annotation { font-size:14px; fill:#526174; }
      .branch { font-size:14px; font-weight:700; fill:#334155; }
      .legend { font-size:14px; fill:#526174; }
      .source { font-size:13px; fill:#64748b; }
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:2; rx:10; }
      .entry { fill:#eef2ff; stroke:#3157c9; }
      .decision { fill:#fffaf0; stroke:#d6a24e; }
      .effect { fill:#f0fdf4; stroke:#9ac7a3; }
      .skip { fill:#f8fafc; stroke:#94a3b8; }
      .connector { fill:none; stroke:#64748b; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .rail { fill:#3157c9; }
      .boundary { fill:none; stroke:#dbe4ee; stroke-width:1.5; stroke-dasharray:8 8; }
    ]]></style>
  </defs>
  <rect width="2000" height="1960" fill="#fff"/>
  <rect x="80" y="52" width="294" height="34" rx="17" fill="#eef2ff"/>
  <text x="227" y="75" text-anchor="middle" class="section" fill="#3157c9">HAPPY-DOM GLOBAL BRIDGE</text>
  <text x="80" y="132" class="title">Dota SSR · route-window globals</text>
  <text x="80" y="168" class="subtitle">Every prerendered route receives its own browser realm; the returned cleanup callback restores Vite’s exact global property descriptors.</text>
  <rect x="80" y="193" width="1840" height="6" rx="3" fill="#dbe4ee"/>

  <rect x="60" y="230" width="1880" height="1140" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="230" width="12" height="1140" rx="6" class="rail"/>
  <text x="100" y="278" class="section">01 / INSTALL ROUTE-SPECIFIC GLOBALS</text>
  <text x="100" y="307" class="annotation">A fixed allowlist covers DOM constructors, browser APIs, storage, URL APIs, animation, and performance values used by application modules.</text>
  <path d="M100 332 H1900" class="boundary"/>
  <rect x="810" y="390" width="380" height="72" class="card entry"/>
  <text x="1000" y="434" text-anchor="middle" class="label">installWindowGlobals(window)</text>
  <rect x="810" y="570" width="380" height="72" class="card"/>
  <text x="1000" y="614" text-anchor="middle" class="label">for each allowed global key</text>
  <text x="1000" y="664" text-anchor="middle" class="annotation">window, DOM constructors, IntersectionObserver, fetch, storage, URL, timing</text>
  <rect x="810" y="750" width="380" height="72" class="card"/>
  <text x="1000" y="794" text-anchor="middle" class="label">capture original descriptor</text>
  <text x="1000" y="844" text-anchor="middle" class="annotation">descriptor may be absent</text>
  <rect x="810" y="930" width="380" height="72" class="card decision"/>
  <text x="1000" y="974" text-anchor="middle" class="label">key is window or self?</text>
  <rect x="300" y="1100" width="380" height="72" class="card"/>
  <text x="490" y="1144" text-anchor="middle" class="label">use route Window object</text>
  <rect x="1320" y="1100" width="380" height="72" class="card"/>
  <text x="1510" y="1144" text-anchor="middle" class="label">read value from route Window</text>
  <rect x="810" y="1280" width="380" height="72" class="card effect"/>
  <text x="1000" y="1324" text-anchor="middle" class="label">define temporary globalThis property</text>
  <text x="1000" y="1374" text-anchor="middle" class="annotation">configurable + writable replacement; repeat until allowlist is installed</text>
  <path d="M1000 462 V570" class="connector"/>
  <path d="M1000 642 V750" class="connector"/>
  <path d="M1000 822 V930" class="connector"/>
  <path d="M810 966 H740 V1136 H680" class="connector"/><text x="755" y="950" class="branch">yes</text>
  <path d="M1190 966 H1260 V1136 H1320" class="connector"/><text x="1212" y="950" class="branch">no</text>
  <path d="M680 1136 H740 V1316 H810" class="connector"/>
  <path d="M1320 1136 H1260 V1316 H1190" class="connector"/>

  <rect x="60" y="1480" width="1880" height="400" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="1480" width="12" height="400" rx="6" fill="#7c3aed"/>
  <text x="100" y="1528" class="section">02 / RESTORE ORIGINAL PROCESS STATE</text>
  <text x="100" y="1557" class="annotation">The caller invokes this callback after the route window closes; snapshots are traversed in reverse installation order.</text>
  <rect x="810" y="1620" width="380" height="72" class="card entry"/>
  <text x="1000" y="1664" text-anchor="middle" class="label">restoreGlobals()</text>
  <rect x="810" y="1780" width="380" height="72" class="card decision"/>
  <text x="1000" y="1824" text-anchor="middle" class="label">original descriptor existed?</text>
  <rect x="1300" y="1780" width="380" height="72" class="card effect"/>
  <text x="1490" y="1824" text-anchor="middle" class="label">define saved descriptor</text>
  <rect x="320" y="1780" width="380" height="72" class="card effect"/>
  <text x="510" y="1824" text-anchor="middle" class="label">delete temporary global</text>
  <path d="M1000 1692 V1780" class="connector"/>
  <path d="M810 1816 H700" class="connector"/><text x="755" y="1800" class="branch">no</text>
  <path d="M1190 1816 H1300" class="connector"/><text x="1212" y="1800" class="branch">yes</text>
  <rect x="60" y="1885" width="1880" height="1" fill="#e2e8f0"/>
  <rect x="100" y="1910" width="34" height="20" rx="5" class="card entry"/><text x="148" y="1926" class="legend">entry / callback</text>
  <rect x="390" y="1910" width="34" height="20" rx="5" class="card"/><text x="438" y="1926" class="legend">process</text>
  <rect x="590" y="1910" width="34" height="20" rx="5" class="card decision"/><text x="638" y="1926" class="legend">guard</text>
  <rect x="770" y="1910" width="34" height="20" rx="5" class="card effect"/><text x="818" y="1926" class="legend">global state effect</text>
  <text x="1130" y="1926" class="source">Source: packages/libs/dota-ssr/src/vite/window-globals.ts</text>
</svg>
