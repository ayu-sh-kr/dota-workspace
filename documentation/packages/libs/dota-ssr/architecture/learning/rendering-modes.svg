<svg xmlns="http://www.w3.org/2000/svg" class="ssr-learning-diagram" style="display:block;width:100%;max-width:480px;height:auto;margin:1.5rem auto;font-family:DM Sans,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision" viewBox="0 0 480 680" role="img" aria-labelledby="title desc">
<title id="title">When is the page content produced?</title><desc id="desc">CSR builds content in the browser after JavaScript loads. SSR builds content while answering a request. SSG builds HTML before deployment and later requests receive a saved file.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--primary-color, #7352cc)"/></marker></defs><rect class="canvas" fill="var(--background-color, #fafaff)" width="480" height="680" rx="16"/>
<text class="title" fill="var(--foreground-color, #252436)" font-size="24" font-weight="700" x="24" y="38">Same page. Three timelines.</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="24" y="95">CSR · in the visitor’s browser</text><rect class="card accent" fill="var(--primary-color-subtle, #f1edfc)" stroke="var(--primary-color, #7352cc)" stroke-width="1.6" x="24" y="117" width="160" height="72" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="104" y="159" text-anchor="middle">Request</text><rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="280" y="117" width="176" height="72" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="368" y="159" text-anchor="middle">Browser builds</text><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M184 153H280"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="24" y="223">after app JS loads</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="24" y="285">SSR · while answering a request</text><rect class="card accent" fill="var(--primary-color-subtle, #f1edfc)" stroke="var(--primary-color, #7352cc)" stroke-width="1.6" x="24" y="307" width="160" height="72" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="104" y="349" text-anchor="middle">Request</text><rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="280" y="307" width="176" height="72" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="368" y="349" text-anchor="middle">Server builds</text><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M184 343H280"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="24" y="413">HTML in response</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="24" y="475">SSG · before visitors arrive</text><rect class="card accent" fill="var(--primary-color-subtle, #f1edfc)" stroke="var(--primary-color, #7352cc)" stroke-width="1.6" x="24" y="497" width="160" height="72" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="104" y="539" text-anchor="middle">Build</text><rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="280" y="497" width="176" height="72" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="368" y="539" text-anchor="middle">Saved HTML</text><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M184 533H280"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="24" y="603">serve on later requests</text><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M28 645H82"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="100" y="651">Order of work / selected path</text>
</svg>
