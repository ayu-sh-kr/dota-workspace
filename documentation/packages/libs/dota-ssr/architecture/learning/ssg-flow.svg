<svg xmlns="http://www.w3.org/2000/svg" class="ssr-learning-diagram" style="display:block;width:100%;max-width:480px;height:auto;margin:1.5rem auto;font-family:DM Sans,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision" viewBox="0 0 480 884" role="img" aria-labelledby="title desc">
<title id="title">One URL in an SSG build</title><desc id="desc">After the client build, choose concrete URLs. For each URL create a fresh Happy DOM window, run normal application startup, await readiness and pending work, serialize the document and write HTML. Limits and error behavior are explained in the lesson.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--primary-color, #7352cc)"/></marker></defs><rect class="canvas" fill="var(--background-color, #fafaff)" width="480" height="884" rx="16"/>
<text class="title" fill="var(--foreground-color, #252436)" font-size="24" font-weight="700" x="24" y="38">One URL in an SSG build</text><rect class="card accent" fill="var(--primary-color-subtle, #f1edfc)" stroke="var(--primary-color, #7352cc)" stroke-width="1.6" x="42" y="84" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="240" y="114" text-anchor="middle">Select concrete URLs</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="240" y="141" text-anchor="middle">After the client bundle is written</text><rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="42" y="240" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="240" y="270" text-anchor="middle">Fresh Happy DOM window</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="240" y="297" text-anchor="middle">One route; isolated document</text><rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="42" y="396" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="240" y="426" text-anchor="middle">Start the ordinary app</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="240" y="453" text-anchor="middle">No request-time capture hook</text><rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="42" y="552" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="240" y="582" text-anchor="middle">Wait for ready + settled</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="240" y="609" text-anchor="middle">Startup, DOM tasks, tracked fetches</text><rect class="card accent" fill="var(--primary-color-subtle, #f1edfc)" stroke="var(--primary-color, #7352cc)" stroke-width="1.6" x="42" y="708" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="240" y="738" text-anchor="middle">Serialize + write HTML</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="240" y="765" text-anchor="middle">Later requests can serve this file</text><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M240 160V240"/><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M240 316V396"/><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M240 472V552"/><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M240 628V708"/><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M28 846H82"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="100" y="852">Order of work / selected path</text>
</svg>
