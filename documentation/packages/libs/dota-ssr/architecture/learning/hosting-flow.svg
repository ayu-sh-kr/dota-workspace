<svg xmlns="http://www.w3.org/2000/svg" class="ssr-learning-diagram" style="display:block;width:100%;max-width:480px;height:auto;margin:1.5rem auto;font-family:DM Sans,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision" viewBox="0 0 520 690" role="img" aria-labelledby="title desc">
<title id="title">The Node host selects a page producer</title><desc id="desc">For a valid page GET or HEAD, an existing static file is served first. Otherwise a matching SSR handler renders the page. If it declines, the CSR shell is served. Malformed paths, unsupported methods, and rendering errors are covered separately in the lesson.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--primary-color, #7352cc)"/></marker></defs><rect class="canvas" fill="var(--background-color, #fafaff)" width="520" height="690" rx="16"/>
<text class="title" fill="var(--foreground-color, #252436)" font-size="24" font-weight="700" x="24" y="38">Which HTML wins?</text>
<text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="24" y="72">Valid page GET / HEAD on Node</text>
<rect class="card accent" fill="var(--primary-color-subtle, #f1edfc)" stroke="var(--primary-color, #7352cc)" stroke-width="1.6" x="24" y="112" width="200" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="124" y="142" text-anchor="middle">Static file?</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="124" y="169" text-anchor="middle">Inside client output</text>
<rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="334" y="112" width="162" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="415" y="142" text-anchor="middle">Serve file</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="415" y="169" text-anchor="middle">SSG / asset</text>
<rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="24" y="298" width="200" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="124" y="328" text-anchor="middle">SSR match?</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="124" y="355" text-anchor="middle">Ask page handler</text>
<rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="334" y="298" width="162" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="415" y="328" text-anchor="middle">Render SSR</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="415" y="355" text-anchor="middle">Fresh HTML</text>
<rect class="card accent" fill="var(--primary-color-subtle, #f1edfc)" stroke="var(--primary-color, #7352cc)" stroke-width="1.6" x="24" y="484" width="200" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="124" y="514" text-anchor="middle">CSR shell</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="124" y="541" text-anchor="middle">Browser renders</text>
<path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M224 150H334"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="258" y="136">yes</text>
<path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M124 188V298"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="138" y="246">no</text>
<path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M224 336H334"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="258" y="322">yes</text>
<path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M124 374V484"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="138" y="432">no</text>
<text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="24" y="611">A static task page bypasses serverLoad.</text>
<path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M28 650H82"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="100" y="656">Order of work / selected path</text>
</svg>
