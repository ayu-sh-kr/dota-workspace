<svg xmlns="http://www.w3.org/2000/svg" class="ssr-learning-diagram" style="display:block;width:100%;max-width:480px;height:auto;margin:1.5rem auto;font-family:DM Sans,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision" viewBox="0 0 520 925" role="img" aria-labelledby="title desc">
<title id="title">Browser startup has distinct outcomes</title><desc id="desc">Install hydration before registering custom elements. The initial root/page boundary may defer rendering. Compatible ordinary marked hosts adopt parts. Unmarked and client-only hosts mount fresh. Invalid markers warn and recover or throw. These are branches, not consecutive stages.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--primary-color, #7352cc)"/></marker></defs><rect class="canvas" fill="var(--background-color, #fafaff)" width="520" height="925" rx="16"/>
<text class="title" fill="var(--foreground-color, #252436)" font-size="24" font-weight="700" x="24" y="38">Do not repaint everything.</text>
<rect class="card accent" fill="var(--primary-color-subtle, #f1edfc)" stroke="var(--primary-color, #7352cc)" stroke-width="1.6" x="100" y="76" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="298" y="106" text-anchor="middle">Install before registration</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="298" y="133" text-anchor="middle">Then upgrade existing hosts</text>
<path class="rail" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" d="M298 152V182H40V750"/>
<rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="100" y="230" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="298" y="260" text-anchor="middle">Initial root / page</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="298" y="287" text-anchor="middle">Preserve now; defer its renderer</text>
<rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="100" y="390" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="298" y="420" text-anchor="middle">Compatible marked host</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="298" y="447" text-anchor="middle">Adopt existing dynamic parts</text>
<rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="100" y="550" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="298" y="580" text-anchor="middle">Unmarked / client-only</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="298" y="607" text-anchor="middle">Mount fresh content</text>
<rect class="card" fill="var(--surface-raised-color, #fff)" stroke="var(--primary-color-border, #8174ad)" stroke-width="1.6" x="100" y="710" width="396" height="76" rx="11"/><text class="label" fill="var(--foreground-color, #252436)" font-size="22" font-weight="600" x="298" y="740" text-anchor="middle">Invalid marked host</text><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="298" y="767" text-anchor="middle">Warn + recover, or throw</text>
<path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M40 268H100"/><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M40 428H100"/><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M40 588H100"/><path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M40 748H100"/>
<text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="24" y="840">Branches, not four consecutive steps.</text>
<path class="arrow" fill="none" stroke="var(--primary-color, #7352cc)" stroke-width="2" marker-end="url(#arrow)" d="M28 884H82"/><text class="note" fill="var(--muted-color, #5d5a73)" font-size="19" x="100" y="890">Order of work / selected path</text>
</svg>
