<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 3340" width="2200" height="3340" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota SSG Vite plugin flow</title>
  <desc id="diagram-desc">Source-backed lifecycle for dotaSsg: Vite closes the client bundle, routes are resolved, each route executes in an isolated happy-dom window, and static HTML plus optional Vercel redirects are written.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <style><![CDATA[
      svg { background:#fff; text-rendering:geometricPrecision; }
      text { font-family:"DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill:#1f2937; }
      .title { font-size:34px; font-weight:700; letter-spacing:-.025em; }
      .subtitle { font-size:18px; fill:#526174; }
      .section { font-size:18px; font-weight:700; letter-spacing:.05em; fill:#334155; }
      .label { font-size:16px; font-weight:700; }
      .annotation { font-size:14px; fill:#526174; }
      .branch { font-size:14px; font-weight:700; fill:#334155; }
      .legend { font-size:14px; fill:#526174; }
      .source { font-size:13px; fill:#64748b; }
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:2; rx:10; }
      .entry { fill:#eef2ff; stroke:#3157c9; }
      .decision { fill:#fffaf0; stroke:#d6a24e; }
      .effect { fill:#f0fdf4; stroke:#9ac7a3; }
      .skip { fill:#f8fafc; stroke:#94a3b8; }
      .connector { fill:none; stroke:#64748b; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .async { fill:none; stroke:#7c3aed; stroke-width:2.5; stroke-dasharray:10 8; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-async); }
      .rail { fill:#3157c9; }
      .boundary { fill:none; stroke:#dbe4ee; stroke-width:1.5; stroke-dasharray:8 8; }
    ]]></style>
  </defs>
  <rect width="2200" height="3340" fill="#fff"/>
  <rect x="80" y="52" width="276" height="34" rx="17" fill="#eef2ff"/>
  <text x="218" y="75" text-anchor="middle" class="section" fill="#3157c9">VITE SSG PLUGIN FLOW</text>
  <text x="80" y="132" class="title">Dota SSR · static generation lifecycle</text>
  <text x="80" y="168" class="subtitle">`dotaSsg()` runs after the client bundle, re-executes the app once per selected route, and writes marked static HTML.</text>
  <rect x="80" y="193" width="2040" height="6" rx="3" fill="#dbe4ee"/>

  <rect x="60" y="230" width="2080" height="820" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="230" width="12" height="820" rx="6" class="rail"/>
  <text x="100" y="278" class="section">01 / BUILD LIFECYCLE AND ROUTE SELECTION</text>
  <text x="100" y="307" class="annotation">The plugin is build-only and post-enforced; `closeBundle()` runs only after Vite writes the client shell.</text>
  <path d="M100 332 H2100" class="boundary"/>
  <rect x="910" y="380" width="380" height="72" class="card entry"/>
  <text x="1100" y="424" text-anchor="middle" class="label">dotaSsg(options)</text>
  <rect x="910" y="550" width="380" height="72" class="card"/>
  <text x="1100" y="594" text-anchor="middle" class="label">configResolved(config)</text>
  <rect x="910" y="720" width="380" height="72" class="card entry"/>
  <text x="1100" y="764" text-anchor="middle" class="label">closeBundle()</text>
  <rect x="910" y="890" width="380" height="72" class="card"/>
  <text x="1100" y="934" text-anchor="middle" class="label">read built HTML shell + create Vite server</text>
  <text x="1100" y="984" text-anchor="middle" class="annotation">middleware server retains app plugins and SSR transforms</text>
  <rect x="910" y="1060" width="380" height="72" class="card decision"/>
  <text x="1100" y="1104" text-anchor="middle" class="label">autoDetectRoutes?</text>
  <rect x="390" y="1210" width="380" height="72" class="card"/>
  <text x="580" y="1254" text-anchor="middle" class="label">resolveSsgRoutes(explicit)</text>
  <rect x="1430" y="1210" width="380" height="72" class="card"/>
  <text x="1620" y="1254" text-anchor="middle" class="label">load route metadata</text>
  <text x="1620" y="1304" text-anchor="middle" class="annotation">virtual:dota-route-metadata; page modules stay unloaded</text>
  <rect x="1430" y="1390" width="380" height="72" class="card decision"/>
  <text x="1620" y="1434" text-anchor="middle" class="label">metadata array?</text>
  <rect x="1880" y="1390" width="200" height="72" class="card skip"/>
  <text x="1980" y="1434" text-anchor="middle" class="label">throw error</text>
  <rect x="910" y="1390" width="380" height="72" class="card"/>
  <text x="1100" y="1434" text-anchor="middle" class="label">resolveDecoratedSsgRoutes()</text>
  <text x="1100" y="1484" text-anchor="middle" class="annotation">select ssr:true; explicit output mapping wins</text>
  <path d="M1100 452 V550" class="connector"/>
  <path d="M1100 622 V720" class="connector"/>
  <path d="M1100 792 V890" class="connector"/>
  <path d="M1100 962 V1060" class="connector"/>
  <path d="M910 1096 H840 V1246 H770" class="connector"/><text x="855" y="1080" class="branch">no</text>
  <path d="M1290 1096 H1360 V1246 H1430" class="connector"/><text x="1312" y="1080" class="branch">yes</text>
  <path d="M1620 1282 V1390" class="connector"/>
  <path d="M1810 1426 H1880" class="connector"/><text x="1825" y="1410" class="branch">no</text>
  <path d="M1430 1426 H1360 V1426 H1290" class="connector"/><text x="1330" y="1410" class="branch">yes</text>
  <path d="M770 1246 H840 V1426 H910" class="connector"/>

  <rect x="60" y="1540" width="2080" height="1710" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="1540" width="12" height="1710" rx="6" fill="#7c3aed"/>
  <text x="100" y="1588" class="section">02 / ISOLATED ROUTE PRERENDER</text>
  <text x="100" y="1617" class="annotation">The following loop executes once for every resolved route. Cleanup runs even when application initialization fails.</text>
  <path d="M100 1642 H2100" class="boundary"/>
  <rect x="910" y="1700" width="380" height="72" class="card entry"/>
  <text x="1100" y="1744" text-anchor="middle" class="label">for each resolved route</text>
  <rect x="910" y="1880" width="380" height="72" class="card"/>
  <text x="1100" y="1924" text-anchor="middle" class="label">fresh Window + install globals</text>
  <text x="1100" y="1974" text-anchor="middle" class="annotation">write shell; invalidate module graph</text>
  <rect x="910" y="2060" width="380" height="72" class="card"/>
  <text x="1100" y="2104" text-anchor="middle" class="label">load virtual SSG entry</text>
  <text x="1100" y="2154" text-anchor="middle" class="annotation">enable markers; import configured app entry</text>
  <rect x="910" y="2240" width="380" height="72" class="card decision"/>
  <text x="1100" y="2284" text-anchor="middle" class="label">ready export is a Promise?</text>
  <rect x="390" y="2240" width="380" height="72" class="card skip"/>
  <text x="580" y="2284" text-anchor="middle" class="label">throw readiness error</text>
  <rect x="910" y="2420" width="380" height="72" class="card"/>
  <text x="1100" y="2464" text-anchor="middle" class="label">await app, happy-dom, settle</text>
  <rect x="910" y="2600" width="380" height="72" class="card effect"/>
  <text x="1100" y="2644" text-anchor="middle" class="label">write dist/&lt;route&gt;/index.html</text>
  <text x="1100" y="2694" text-anchor="middle" class="annotation">finally: disable markers, close window, restore globals</text>
  <rect x="910" y="2800" width="380" height="72" class="card"/>
  <text x="1100" y="2844" text-anchor="middle" class="label">all route documents written</text>
  <rect x="910" y="2980" width="380" height="72" class="card decision"/>
  <text x="1100" y="3024" text-anchor="middle" class="label">vercel option enabled?</text>
  <rect x="910" y="3160" width="380" height="72" class="card effect"/>
  <text x="1100" y="3204" text-anchor="middle" class="label">update vercel.json redirects</text>
  <text x="1100" y="3254" text-anchor="middle" class="annotation">preserve unrelated Vercel configuration</text>
  <path d="M1100 1772 V1880" class="connector"/>
  <path d="M1100 1952 V2060" class="connector"/>
  <path d="M1100 2132 V2240" class="connector"/>
  <path d="M910 2276 H770" class="connector"/><text x="835" y="2260" class="branch">no</text>
  <path d="M1100 2312 V2420" class="async"/><text x="1120" y="2368" class="branch">yes</text>
  <path d="M1100 2492 V2600" class="connector"/>
  <path d="M1100 2672 V2800" class="connector"/>
  <path d="M1100 2872 V2980" class="connector"/>
  <path d="M1100 3052 V3160" class="connector"/><text x="1120" y="3108" class="branch">yes</text>
  <text x="1320" y="3024" class="branch">no: no config mutation</text>
  <rect x="60" y="3280" width="2080" height="1" fill="#e2e8f0"/>
  <rect x="100" y="3296" width="34" height="20" rx="5" class="card entry"/><text x="148" y="3312" class="legend">entry / lifecycle trigger</text>
  <rect x="410" y="3296" width="34" height="20" rx="5" class="card"/><text x="458" y="3312" class="legend">process</text>
  <rect x="620" y="3296" width="34" height="20" rx="5" class="card decision"/><text x="668" y="3312" class="legend">guard</text>
  <rect x="830" y="3296" width="34" height="20" rx="5" class="card effect"/><text x="878" y="3312" class="legend">artifact / effect</text>
  <path d="M1150 3306 H1220" class="async"/><text x="1240" y="3312" class="legend">awaited work</text>
  <text x="1500" y="3312" class="source">Source: packages/libs/dota-ssr/src/vite/index.ts</text>
</svg>
