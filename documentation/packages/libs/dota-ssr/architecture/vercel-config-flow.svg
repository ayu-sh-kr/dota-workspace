<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2100" width="2000" height="2100" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota SSR Vercel configuration update flow</title>
  <desc id="diagram-desc">Source-backed flow for discovering a Vercel configuration, preserving user settings, replacing SSG-owned redirects, and conditionally writing the resulting JSON.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <style><![CDATA[
      svg { background:#fff; text-rendering:geometricPrecision; } text { font-family:"DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill:#1f2937; }
      .title { font-size:34px; font-weight:700; letter-spacing:-.025em; } .subtitle { font-size:18px; fill:#526174; } .section { font-size:18px; font-weight:700; letter-spacing:.05em; fill:#334155; }
      .label { font-size:16px; font-weight:700; } .annotation { font-size:14px; fill:#526174; } .branch { font-size:14px; font-weight:700; fill:#334155; } .legend { font-size:14px; fill:#526174; } .source { font-size:13px; fill:#64748b; }
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:2; rx:10; } .entry { fill:#eef2ff; stroke:#3157c9; } .decision { fill:#fffaf0; stroke:#d6a24e; } .effect { fill:#f0fdf4; stroke:#9ac7a3; } .skip { fill:#f8fafc; stroke:#94a3b8; }
      .connector { fill:none; stroke:#64748b; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); } .rail { fill:#3157c9; } .boundary { fill:none; stroke:#dbe4ee; stroke-width:1.5; stroke-dasharray:8 8; }
    ]]></style>
  </defs>
  <rect width="2000" height="2100" fill="#fff"/><rect x="80" y="52" width="276" height="34" rx="17" fill="#eef2ff"/><text x="218" y="75" text-anchor="middle" class="section" fill="#3157c9">VERCEL CONFIG FLOW</text>
  <text x="80" y="132" class="title">Dota SSR · generated redirect updates</text><text x="80" y="168" class="subtitle">Only SSG-owned redirect sources change; other Vercel settings and redirect entries are retained.</text><rect x="80" y="193" width="1840" height="6" rx="3" fill="#dbe4ee"/>
  <rect x="60" y="230" width="1880" height="1700" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="60" y="230" width="12" height="1700" rx="6" class="rail"/>
  <text x="100" y="278" class="section">01 / DISCOVER, MERGE, AND WRITE</text><text x="100" y="307" class="annotation">Called only when `dotaSsg({vercel: true})` completes all static route documents.</text><path d="M100 332 H1900" class="boundary"/>
  <rect x="810" y="390" width="380" height="72" class="card entry"/><text x="1000" y="434" text-anchor="middle" class="label">updateVercelConfig(root, routes)</text>
  <rect x="810" y="570" width="380" height="72" class="card decision"/><text x="1000" y="614" text-anchor="middle" class="label">explicit configFile?</text>
  <rect x="270" y="750" width="380" height="72" class="card"/><text x="460" y="794" text-anchor="middle" class="label">resolve explicit path + read text</text>
  <rect x="1350" y="750" width="380" height="72" class="card"/><text x="1540" y="794" text-anchor="middle" class="label">search ancestors for vercel.json</text><text x="1540" y="844" text-anchor="middle" class="annotation">read first match; throw if filesystem root reached</text>
  <rect x="810" y="930" width="380" height="72" class="card"/><text x="1000" y="974" text-anchor="middle" class="label">parse JSON object</text>
  <rect x="810" y="1110" width="380" height="72" class="card decision"/><text x="1000" y="1154" text-anchor="middle" class="label">redirects absent or array?</text>
  <rect x="1310" y="1110" width="380" height="72" class="card skip"/><text x="1500" y="1154" text-anchor="middle" class="label">throw configuration error</text>
  <rect x="810" y="1290" width="380" height="72" class="card"/><text x="1000" y="1334" text-anchor="middle" class="label">create generated redirects</text><text x="1000" y="1384" text-anchor="middle" class="annotation">omit root; index.html → trailing slash; custom file → file URL</text>
  <rect x="810" y="1470" width="380" height="72" class="card"/><text x="1000" y="1514" text-anchor="middle" class="label">preserve non-owned redirect entries</text><text x="1000" y="1564" text-anchor="middle" class="annotation">replace entries only when source matches generated source</text>
  <rect x="810" y="1650" width="380" height="72" class="card decision"/><text x="1000" y="1694" text-anchor="middle" class="label">serialized JSON changed?</text>
  <rect x="810" y="1830" width="380" height="72" class="card effect"/><text x="1000" y="1874" text-anchor="middle" class="label">write updated vercel.json</text>
  <text x="1220" y="1694" class="branch">no: retain existing file text</text>
  <path d="M1000 462 V570" class="connector"/><path d="M810 606 H720 V786 H650" class="connector"/><text x="735" y="590" class="branch">yes</text><path d="M1190 606 H1280 V786 H1350" class="connector"/><text x="1212" y="590" class="branch">no</text>
  <path d="M650 786 H720 V966 H810" class="connector"/><path d="M1350 786 H1280 V966 H1190" class="connector"/><path d="M1000 1002 V1110" class="connector"/><path d="M1190 1146 H1310" class="connector"/><text x="1212" y="1130" class="branch">no</text><path d="M1000 1182 V1290" class="connector"/><text x="1020" y="1238" class="branch">yes</text><path d="M1000 1362 V1470" class="connector"/><path d="M1000 1542 V1650" class="connector"/><path d="M1000 1722 V1830" class="connector"/><text x="1020" y="1778" class="branch">yes</text>
  <rect x="60" y="1950" width="1880" height="1" fill="#e2e8f0"/><rect x="100" y="1980" width="34" height="20" rx="5" class="card entry"/><text x="148" y="1996" class="legend">entry</text><rect x="300" y="1980" width="34" height="20" rx="5" class="card"/><text x="348" y="1996" class="legend">process</text><rect x="500" y="1980" width="34" height="20" rx="5" class="card decision"/><text x="548" y="1996" class="legend">guard</text><rect x="680" y="1980" width="34" height="20" rx="5" class="card effect"/><text x="728" y="1996" class="legend">file effect</text><text x="1020" y="1996" class="source">Source: packages/libs/dota-ssr/src/vite/vercel-config.ts</text>
</svg>
