<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 2320" width="2200" height="2320" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota SSR route output resolution</title>
  <desc id="diagram-desc">Source-backed flow for resolving safe static-generation output files from explicit routes and opt-in decorated route metadata.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <style><![CDATA[
      svg { background:#fff; text-rendering:geometricPrecision; }
      text { font-family:"DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill:#1f2937; }
      .title { font-size:34px; font-weight:700; letter-spacing:-.025em; }
      .subtitle { font-size:18px; fill:#526174; }
      .section { font-size:18px; font-weight:700; letter-spacing:.05em; fill:#334155; }
      .label { font-size:16px; font-weight:700; }
      .annotation { font-size:14px; fill:#526174; }
      .branch { font-size:14px; font-weight:700; fill:#334155; }
      .legend { font-size:14px; fill:#526174; }
      .source { font-size:13px; fill:#64748b; }
      .card { fill:#fff; stroke:#cbd5e1; stroke-width:2; rx:10; }
      .entry { fill:#eef2ff; stroke:#3157c9; }
      .decision { fill:#fffaf0; stroke:#d6a24e; }
      .effect { fill:#f0fdf4; stroke:#9ac7a3; }
      .skip { fill:#f8fafc; stroke:#94a3b8; }
      .connector { fill:none; stroke:#64748b; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .plain { fill:none; stroke:#94a3b8; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .rail { fill:#3157c9; }
      .boundary { fill:none; stroke:#dbe4ee; stroke-width:1.5; stroke-dasharray:8 8; }
    ]]></style>
  </defs>

  <rect width="2200" height="2320" fill="#fff"/>
  <rect x="80" y="52" width="302" height="34" rx="17" fill="#eef2ff"/>
  <text x="231" y="75" text-anchor="middle" class="section" fill="#3157c9">SSG ROUTE OUTPUT FLOW</text>
  <text x="80" y="132" class="title">Dota SSR · resolve route outputs</text>
  <text x="80" y="168" class="subtitle">Explicit routes are normalized and validated; opt-in decorated routes join only when concrete, with explicit output mappings taking precedence.</text>
  <rect x="80" y="193" width="2040" height="6" rx="3" fill="#dbe4ee"/>

  <rect x="60" y="230" width="2080" height="760" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="230" width="12" height="760" rx="6" class="rail"/>
  <text x="100" y="278" class="section">01 / resolveSsgRoutes(routes)</text>
  <text x="100" y="307" class="annotation">One shared policy used for explicit routes, detected routes, and their final merged result.</text>
  <path d="M100 332 H2100" class="boundary"/>

  <rect x="910" y="390" width="380" height="72" class="card entry"/>
  <text x="1100" y="434" text-anchor="middle" class="label">route input</text>
  <text x="1100" y="484" text-anchor="middle" class="annotation">string path or { path, output }</text>
  <rect x="910" y="570" width="380" height="72" class="card decision"/>
  <text x="1100" y="614" text-anchor="middle" class="label">absolute path without ? or #?</text>
  <text x="1310" y="614" class="branch">no</text>
  <text x="1325" y="642" class="annotation">throw invalid pathname</text>
  <rect x="910" y="750" width="380" height="72" class="card"/>
  <text x="1100" y="794" text-anchor="middle" class="label">normalize path and default output</text>
  <text x="1100" y="844" text-anchor="middle" class="annotation">/ → index.html; otherwise path/index.html</text>
  <rect x="910" y="930" width="380" height="72" class="card decision"/>
  <text x="1100" y="974" text-anchor="middle" class="label">safe relative .html output?</text>
  <text x="1310" y="974" class="branch">no</text>
  <text x="1325" y="1002" class="annotation">throw unsafe output</text>
  <rect x="910" y="1110" width="380" height="72" class="card"/>
  <text x="1100" y="1154" text-anchor="middle" class="label">sort by normalized pathname</text>
  <rect x="910" y="1290" width="380" height="72" class="card decision"/>
  <text x="1100" y="1334" text-anchor="middle" class="label">unique paths and outputs?</text>
  <text x="1310" y="1334" class="branch">no</text>
  <text x="1325" y="1362" class="annotation">throw duplicate path or output</text>
  <rect x="910" y="1470" width="380" height="72" class="card effect"/>
  <text x="1100" y="1514" text-anchor="middle" class="label">ResolvedDotaSsgRoute[]</text>
  <text x="1100" y="1564" text-anchor="middle" class="annotation">stable safe mappings below Vite output directory</text>
  <path d="M1100 462 V570" class="connector"/>
  <path d="M1100 642 V750" class="connector"/><text x="1120" y="698" class="branch">yes</text>
  <path d="M1100 822 V930" class="connector"/>
  <path d="M1100 1002 V1110" class="connector"/><text x="1120" y="1058" class="branch">yes</text>
  <path d="M1100 1182 V1290" class="connector"/>
  <path d="M1100 1362 V1470" class="connector"/><text x="1120" y="1418" class="branch">yes</text>

  <rect x="60" y="1640" width="2080" height="590" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="60" y="1640" width="12" height="590" rx="6" fill="#7c3aed"/>
  <text x="100" y="1688" class="section">02 / resolveDecoratedSsgRoutes(decoratedRoutes, routes)</text>
  <text x="100" y="1717" class="annotation">Only opted-in metadata may become generated output. Explicit input is resolved independently and wins on an identical pathname.</text>
  <path d="M100 1742 H2100" class="boundary"/>
  <rect x="130" y="1800" width="380" height="72" class="card entry"/>
  <text x="320" y="1844" text-anchor="middle" class="label">decorated route metadata</text>
  <rect x="630" y="1800" width="380" height="72" class="card decision"/>
  <text x="820" y="1844" text-anchor="middle" class="label">ssr === true?</text>
  <rect x="630" y="1980" width="380" height="72" class="card skip"/>
  <text x="820" y="2024" text-anchor="middle" class="label">ignore route metadata</text>
  <rect x="1130" y="1800" width="380" height="72" class="card decision"/>
  <text x="1320" y="1844" text-anchor="middle" class="label">contains :dynamic segment?</text>
  <rect x="1130" y="1980" width="380" height="72" class="card skip"/>
  <text x="1320" y="2024" text-anchor="middle" class="label">throw concrete-route error</text>
  <rect x="1630" y="1800" width="380" height="72" class="card entry"/>
  <text x="1820" y="1844" text-anchor="middle" class="label">explicit SSG routes</text>
  <rect x="1630" y="1980" width="380" height="72" class="card"/>
  <text x="1820" y="2024" text-anchor="middle" class="label">resolve and merge routes</text>
  <text x="1820" y="2074" text-anchor="middle" class="annotation">filter detected paths present in explicit routes</text>
  <rect x="1630" y="2160" width="380" height="72" class="card effect"/>
  <text x="1820" y="2204" text-anchor="middle" class="label">resolved static routes</text>
  <path d="M510 1836 H630" class="connector"/>
  <path d="M820 1872 V1980" class="connector"/><text x="840" y="1928" class="branch">no</text>
  <path d="M1010 1836 H1130" class="connector"/><text x="1032" y="1820" class="branch">yes</text>
  <path d="M1320 1872 V1980" class="connector"/><text x="1340" y="1928" class="branch">yes</text>
  <path d="M1510 1836 H1570 V2016 H1630" class="connector"/><text x="1528" y="1820" class="branch">no</text>
  <path d="M1820 1872 V1980" class="connector"/>
  <path d="M1820 2052 V2160" class="connector"/>
  <rect x="60" y="2260" width="2080" height="1" fill="#e2e8f0"/>
  <rect x="100" y="2280" width="34" height="20" rx="5" class="card entry"/><text x="148" y="2296" class="legend">entry / input</text>
  <rect x="360" y="2280" width="34" height="20" rx="5" class="card"/><text x="408" y="2296" class="legend">processing</text>
  <rect x="570" y="2280" width="34" height="20" rx="5" class="card decision"/><text x="618" y="2296" class="legend">guard</text>
  <rect x="740" y="2280" width="34" height="20" rx="5" class="card effect"/><text x="788" y="2296" class="legend">resolved output</text>
  <text x="1110" y="2296" class="source">Source: packages/libs/dota-ssr/src/vite/route-output.ts</text>
</svg>
