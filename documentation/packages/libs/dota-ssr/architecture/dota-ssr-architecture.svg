<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2940" width="2400" height="2940" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota SSR architecture</title>
  <desc id="diagram-desc">Source-backed architecture for Dota SSR's opt-in Vite static-generation plugin and opt-in browser hydration runtime. Static route documents are generated during Vite closeBundle, then are adopted or remounted by the browser runtime.</desc>

  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <style><![CDATA[
      svg { background:#ffffff; text-rendering:geometricPrecision; }
      text { font-family:"DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill:#1f2937; }
      .title { font-size:36px; font-weight:700; letter-spacing:-.025em; }
      .subtitle { font-size:18px; fill:#526174; }
      .section { font-size:18px; font-weight:700; letter-spacing:.05em; fill:#334155; }
      .lane { font-size:20px; font-weight:700; fill:#334155; }
      .lane-subtitle { font-size:15px; fill:#64748b; }
      .card-label { font-size:16px; font-weight:700; fill:#1f2937; }
      .annotation { font-size:14px; fill:#526174; }
      .branch { font-size:14px; font-weight:700; fill:#334155; }
      .terminal { font-size:15px; font-weight:700; fill:#1f2937; }
      .legend { font-size:14px; fill:#526174; }
      .source { font-size:13px; fill:#64748b; }
      .connector { fill:none; stroke:#64748b; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-solid); }
      .connector-async { fill:none; stroke:#7c3aed; stroke-width:2.5; stroke-dasharray:10 8; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow-async); }
      .plain { fill:none; stroke:#94a3b8; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .card { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:10; }
      .entry { fill:#eef2ff; stroke:#3157c9; }
      .decision { fill:#fffaf0; stroke:#d6a24e; }
      .effect { fill:#f0fdf4; stroke:#9ac7a3; }
      .skip { fill:#f8fafc; stroke:#94a3b8; }
      .panel { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; }
      .rail { fill:#3157c9; }
      .dashed { fill:none; stroke:#dbe4ee; stroke-width:1.5; stroke-dasharray:8 8; }
    ]]></style>
  </defs>

  <rect width="2400" height="2940" fill="#ffffff"/>
  <rect x="80" y="54" width="302" height="34" rx="17" fill="#eef2ff"/>
  <text x="231" y="77" text-anchor="middle" class="section" fill="#3157c9">SSG + HYDRATION · HLD</text>
  <text x="80" y="132" class="title">Dota SSR · architecture</text>
  <text x="80" y="168" class="subtitle">Two opt-in extensions: build static, route-specific documents with Vite; adopt them in the browser when hydration markers match.</text>
  <rect x="80" y="193" width="2240" height="6" rx="3" fill="#dbe4ee"/>

  <!-- Build-time SSG -->
  <rect x="60" y="230" width="2280" height="1700" rx="24" class="panel"/>
  <rect x="60" y="230" width="12" height="1700" rx="6" class="rail"/>
  <text x="100" y="278" class="section">01 / BUILD-TIME STATIC GENERATION</text>
  <text x="100" y="307" class="lane-subtitle">The build-only Vite plugin runs after the client bundle exists and writes one settled document per resolved route.</text>
  <path d="M100 332 H2300" class="dashed"/>

  <rect x="1010" y="370" width="380" height="72" class="card entry"/>
  <text x="1200" y="414" text-anchor="middle" class="card-label">dotaSsg(options)</text>
  <text x="1200" y="464" text-anchor="middle" class="annotation">Vite build plugin · apply: build · enforce: post</text>
  <rect x="1010" y="560" width="380" height="72" class="card"/>
  <text x="1200" y="604" text-anchor="middle" class="card-label">closeBundle()</text>
  <text x="1200" y="654" text-anchor="middle" class="annotation">read dist/index.html shell · create isolated middleware Vite server</text>
  <rect x="1010" y="750" width="380" height="72" class="card decision"/>
  <text x="1200" y="794" text-anchor="middle" class="card-label">autoDetectRoutes?</text>

  <rect x="470" y="900" width="380" height="72" class="card"/>
  <text x="660" y="944" text-anchor="middle" class="card-label">resolveSsgRoutes(routes)</text>
  <text x="660" y="994" text-anchor="middle" class="annotation">explicit paths and optional output files</text>
  <rect x="1550" y="900" width="380" height="72" class="card"/>
  <text x="1740" y="944" text-anchor="middle" class="card-label">load routeMetadata</text>
  <text x="1740" y="994" text-anchor="middle" class="annotation">virtual:dota-route-metadata · no page modules evaluated</text>
  <rect x="1550" y="1080" width="380" height="72" class="card decision"/>
  <text x="1740" y="1124" text-anchor="middle" class="card-label">@Route({ssr: true}) concrete?</text>
  <rect x="2010" y="1080" width="250" height="72" class="card skip"/>
  <text x="2135" y="1124" text-anchor="middle" class="terminal">throw for :param route</text>

  <rect x="1010" y="1080" width="380" height="72" class="card"/>
  <text x="1200" y="1124" text-anchor="middle" class="card-label">resolveDecoratedSsgRoutes()</text>
  <text x="1200" y="1174" text-anchor="middle" class="annotation">merge detected routes; explicit path wins; normalize and sort</text>
  <rect x="1010" y="1260" width="380" height="72" class="card"/>
  <text x="1200" y="1304" text-anchor="middle" class="card-label">prerender each route in fresh Window</text>
  <text x="1200" y="1354" text-anchor="middle" class="annotation">install globals → write shell → invalidate module graph → enable marker emission</text>
  <rect x="1010" y="1440" width="380" height="72" class="card decision"/>
  <text x="1200" y="1484" text-anchor="middle" class="card-label">applicationReady Promise exported?</text>
  <rect x="520" y="1440" width="340" height="72" class="card skip"/>
  <text x="690" y="1484" text-anchor="middle" class="terminal">throw missing ready export</text>
  <rect x="1010" y="1620" width="380" height="72" class="card effect"/>
  <text x="1200" y="1664" text-anchor="middle" class="card-label">write dist/&lt;route&gt;/index.html</text>
  <text x="1200" y="1714" text-anchor="middle" class="annotation">await app + happy-dom work + optional settle; restore globals</text>
  <rect x="1550" y="1620" width="380" height="72" class="card decision"/>
  <text x="1740" y="1664" text-anchor="middle" class="card-label">vercel option enabled?</text>
  <rect x="1550" y="1800" width="380" height="72" class="card effect"/>
  <text x="1740" y="1844" text-anchor="middle" class="card-label">update nearest vercel.json</text>
  <text x="1740" y="1894" text-anchor="middle" class="annotation">generated redirects only; retain unrelated configuration</text>

  <path d="M1200 442 V560" class="connector"/>
  <path d="M1200 632 V750" class="connector"/>
  <path d="M1010 786 H900 V936 H850" class="connector"/>
  <text x="920" y="770" class="branch">no</text>
  <path d="M1390 786 H1480 V936 H1550" class="connector"/>
  <text x="1412" y="770" class="branch">yes</text>
  <path d="M1740 972 V1080" class="connector"/>
  <path d="M1930 1116 H2010" class="connector"/>
  <text x="1950" y="1100" class="branch">no</text>
  <path d="M1550 1116 H1480 V1116 H1390" class="connector"/>
  <text x="1435" y="1100" class="branch">yes</text>
  <path d="M850 936 H930 V1116 H1010" class="connector"/>
  <path d="M1200 1152 V1260" class="connector"/>
  <path d="M1200 1332 V1440" class="connector"/>
  <path d="M1010 1476 H860" class="connector"/>
  <text x="925" y="1460" class="branch">no</text>
  <path d="M1200 1512 V1620" class="connector"/>
  <text x="1220" y="1568" class="branch">yes</text>
  <path d="M1390 1656 H1550" class="connector"/>
  <path d="M1740 1692 V1800" class="connector"/>
  <text x="1760" y="1748" class="branch">yes</text>
  <path d="M1740 1692 V1740 H2100" class="plain"/>
  <text x="2060" y="1730" class="branch">no: no config change</text>

  <!-- Browser hydration -->
  <rect x="60" y="1970" width="2280" height="820" rx="24" class="panel"/>
  <rect x="60" y="1970" width="12" height="820" rx="6" fill="#7c3aed"/>
  <text x="100" y="2018" class="section">02 / BROWSER RUNTIME HYDRATION</text>
  <text x="100" y="2047" class="lane-subtitle">The runtime plugin is independently installed through initializeApp. Unmarked components and later routes retain Dota's normal client path.</text>
  <path d="M100 2072 H2300" class="dashed"/>

  <rect x="160" y="2140" width="380" height="72" class="card effect"/>
  <text x="350" y="2184" text-anchor="middle" class="card-label">served static route document</text>
  <text x="350" y="2234" text-anchor="middle" class="annotation">dist/&lt;route&gt;/index.html with hydration markers</text>
  <rect x="760" y="2140" width="380" height="72" class="card entry"/>
  <text x="950" y="2184" text-anchor="middle" class="card-label">dotaHydration({mismatch})</text>
  <text x="950" y="2234" text-anchor="middle" class="annotation">installed through initializeApp({plugins})</text>
  <rect x="760" y="2320" width="380" height="72" class="card"/>
  <text x="950" y="2364" text-anchor="middle" class="card-label">install mount strategy</text>
  <rect x="1260" y="2320" width="380" height="72" class="card"/>
  <text x="1450" y="2364" text-anchor="middle" class="card-label">wrap initial route renderer</text>
  <rect x="760" y="2500" width="380" height="72" class="card decision"/>
  <text x="950" y="2544" text-anchor="middle" class="card-label">markers + template identity match?</text>
  <rect x="280" y="2500" width="340" height="72" class="card effect"/>
  <text x="450" y="2544" text-anchor="middle" class="card-label">mountRender(root, output)</text>
  <text x="450" y="2594" text-anchor="middle" class="annotation">unmarked host or recover mismatch</text>
  <rect x="760" y="2680" width="380" height="72" class="card effect"/>
  <text x="950" y="2724" text-anchor="middle" class="card-label">hydrate(root, output)</text>
  <rect x="1260" y="2500" width="380" height="72" class="card decision"/>
  <text x="1450" y="2544" text-anchor="middle" class="card-label">initial marked page matches path?</text>
  <rect x="1760" y="2500" width="380" height="72" class="card effect"/>
  <text x="1950" y="2544" text-anchor="middle" class="card-label">preserve server page host</text>
  <rect x="1260" y="2680" width="380" height="72" class="card"/>
  <text x="1450" y="2724" text-anchor="middle" class="card-label">delegate to normal router renderer</text>

  <path d="M350 2212 H760" class="connector"/>
  <path d="M950 2212 V2320" class="connector"/>
  <path d="M1140 2176 H1450 V2320" class="connector"/>
  <path d="M950 2392 V2500" class="connector"/>
  <path d="M760 2536 H620" class="connector"/>
  <text x="685" y="2520" class="branch">no / recover</text>
  <path d="M950 2572 V2680" class="connector"/>
  <text x="970" y="2628" class="branch">yes</text>
  <path d="M1450 2392 V2500" class="connector"/>
  <path d="M1640 2536 H1760" class="connector"/>
  <text x="1660" y="2520" class="branch">yes</text>
  <path d="M1450 2572 V2680" class="connector"/>
  <text x="1470" y="2628" class="branch">no / later navigation</text>

  <rect x="60" y="2780" width="2280" height="1" fill="#e2e8f0"/>
  <rect x="100" y="2820" width="34" height="20" rx="5" class="card entry"/><text x="148" y="2836" class="legend">entry / opt-in trigger</text>
  <rect x="370" y="2820" width="34" height="20" rx="5" class="card"/><text x="418" y="2836" class="legend">process</text>
  <rect x="560" y="2820" width="34" height="20" rx="5" class="card decision"/><text x="608" y="2836" class="legend">source-backed decision</text>
  <rect x="860" y="2820" width="34" height="20" rx="5" class="card effect"/><text x="908" y="2836" class="legend">artifact / browser effect</text>
  <path d="M1230 2830 H1300" class="connector"/><text x="1320" y="2836" class="legend">synchronous flow</text>
  <path d="M1510 2830 H1580" class="connector-async"/><text x="1600" y="2836" class="legend">async wait</text>
  <text x="100" y="2888" class="source">Source: packages/libs/dota-ssr/src/index.ts · vite/index.ts · vite/route-output.ts · vite/vercel-config.ts · vite/window-globals.ts</text>
</svg>
