<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2140" viewBox="0 0 2200 2140" role="img" aria-labelledby="title desc">
  <title id="title">Dota Router route resolution with flat and hierarchical route collections</title>
  <desc id="desc">RouterUtils.render consumes whichever RouteConfig collection DotaRouterService selected. findRoute first checks exact matches, then only performs recursive prefix traversal when a route has children. This lets the current flat generated routeConfig resolve exact paths without prepareConfig, while hierarchical fallback routes support parent and child traversal.</desc>

  <style>
    svg { background: #ffffff; text-rendering: geometricPrecision; }
    text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { font-size: 18px; fill: #526174; }
    .lane-title { font-size: 20px; font-weight: 700; fill: #334155; }
    .lane-note { font-size: 15px; fill: #64748b; }
    .card-label { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .annotation { font-size: 14px; fill: #526174; }
    .branch { font-size: 14px; font-weight: 700; fill: #334155; }
    .terminal { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #526174; }
    .source { font-size: 13px; fill: #64748b; }
    .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
    .entry { fill: #eef2ff; stroke: #3157c9; }
    .process { fill: #ffffff; stroke: #cbd5e1; }
    .decision { fill: #fffaf0; stroke: #d6a24e; }
    .effect { fill: #f0fdf4; stroke: #9ac7a3; }
    .skip { fill: #f8fafc; stroke: #94a3b8; }
    .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-plain { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .rule { stroke: #dbe4ee; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="2200" height="2140" fill="#ffffff"/>
  <text x="80" y="70" class="title">Dota Router · how route resolution works with either collection</text>
  <text x="80" y="106" class="subtitle">The router does not require a tree for every lookup: exact-match resolution works directly against the flat generated array.</text>
  <rect x="80" y="132" width="2040" height="6" rx="3" fill="#dbe4ee"/>

  <rect x="60" y="180" width="2080" height="420" rx="24" class="lane"/>
  <rect x="60" y="650" width="2080" height="1320" rx="24" class="lane"/>

  <text x="100" y="228" class="lane-title">01 / ACTIVE ROUTE COLLECTION</text>
  <text x="100" y="257" class="lane-note">DotaRouterService selects one collection before the adapter starts navigation.</text>

  <rect x="180" y="320" width="460" height="72" class="card entry"/>
  <text x="410" y="364" text-anchor="middle" class="card-label">flat virtual:dota-routes</text>
  <text x="180" y="422" class="code">'/blogs/content' is a top-level entry</text>

  <rect x="1560" y="320" width="460" height="72" class="card entry"/>
  <text x="1790" y="364" text-anchor="middle" class="card-label">hierarchical prepareConfig()</text>
  <text x="1560" y="422" class="code">'/blogs' → children: [{ path: '/content' }]</text>

  <rect x="830" y="470" width="540" height="72" class="card effect"/>
  <text x="1100" y="514" text-anchor="middle" class="card-label">active router.routes</text>
  <text x="830" y="572" class="annotation">RouterUtils receives whichever array DotaRouterService stored</text>

  <path d="M 410 392 V 450 H 900 V 470" class="connector-plain"/>
  <path d="M 1790 392 V 450 H 1300 V 470" class="connector-plain"/>

  <text x="100" y="698" class="lane-title">02 / RouterUtils.render() → findRoute() → DOM effect</text>
  <text x="100" y="727" class="lane-note">The same consumer pipeline handles both flat exact matches and recursive child traversal.</text>

  <rect x="830" y="790" width="540" height="72" class="card process"/>
  <text x="1100" y="834" text-anchor="middle" class="card-label">RouterUtils.render({ path, routes, router })</text>

  <rect x="830" y="940" width="540" height="72" class="card decision"/>
  <text x="1100" y="984" text-anchor="middle" class="card-label">root element exists?</text>
  <rect x="1550" y="940" width="420" height="72" class="card skip"/>
  <text x="1760" y="984" text-anchor="middle" class="terminal">log error → return</text>
  <text x="1550" y="1040" class="annotation">root selector not found</text>

  <rect x="830" y="1090" width="540" height="72" class="card decision"/>
  <text x="1100" y="1134" text-anchor="middle" class="card-label">path === '/error'?</text>
  <rect x="1550" y="1090" width="420" height="72" class="card effect"/>
  <text x="1760" y="1134" text-anchor="middle" class="card-label">render error component</text>
  <text x="1550" y="1190" class="annotation">error route handles missing paths</text>

  <rect x="830" y="1240" width="540" height="72" class="card process"/>
  <text x="1100" y="1284" text-anchor="middle" class="card-label">findRoute(path, routes)</text>
  <text x="830" y="1340" class="code">1 exact route.find(path)</text>
  <text x="830" y="1360" class="code">2 prefix + children → getChildPath → recurse</text>
  <text x="830" y="1380" class="code">3 child missing → return parent route</text>

  <rect x="830" y="1430" width="540" height="72" class="card decision"/>
  <text x="1100" y="1474" text-anchor="middle" class="card-label">route found?</text>
  <rect x="1550" y="1430" width="420" height="72" class="card skip"/>
  <text x="1760" y="1474" text-anchor="middle" class="terminal">route(router, '/error')</text>
  <text x="1550" y="1530" class="annotation">adapter navigates to the error path</text>

  <rect x="830" y="1580" width="540" height="72" class="card decision"/>
  <text x="1100" y="1624" text-anchor="middle" class="card-label">route.render exists?</text>
  <rect x="1550" y="1580" width="420" height="72" class="card effect"/>
  <text x="1760" y="1624" text-anchor="middle" class="card-label">route.render(path)</text>
  <text x="1550" y="1680" class="annotation">custom render owns the DOM effect</text>

  <rect x="830" y="1730" width="540" height="72" class="card decision"/>
  <text x="1100" y="1774" text-anchor="middle" class="card-label">component metadata exists?</text>
  <rect x="1550" y="1730" width="420" height="72" class="card effect"/>
  <text x="1760" y="1774" text-anchor="middle" class="card-label">replace root.innerHTML</text>
  <text x="1550" y="1830" class="code">&lt;component-selector path="path"&gt;</text>
  <rect x="830" y="1880" width="540" height="72" class="card skip"/>
  <text x="1100" y="1924" text-anchor="middle" class="terminal">log component error</text>

  <path d="M 1100 542 V 790" class="connector"/>
  <path d="M 1100 862 V 940" class="connector"/>
  <path d="M 1370 976 H 1550" class="connector"/>
  <text x="1400" y="960" class="branch">no</text>
  <path d="M 1100 1012 V 1090" class="connector"/>
  <text x="1120" y="1060" class="branch">yes</text>
  <path d="M 1370 1126 H 1550" class="connector"/>
  <text x="1400" y="1110" class="branch">yes</text>
  <path d="M 1100 1162 V 1240" class="connector"/>
  <text x="1120" y="1210" class="branch">no</text>
  <path d="M 1100 1312 V 1430" class="connector"/>
  <path d="M 1370 1466 H 1550" class="connector"/>
  <text x="1400" y="1450" class="branch">no</text>
  <path d="M 1100 1502 V 1580" class="connector"/>
  <text x="1120" y="1550" class="branch">yes</text>
  <path d="M 1370 1616 H 1550" class="connector"/>
  <text x="1400" y="1600" class="branch">yes</text>
  <path d="M 1100 1652 V 1730" class="connector"/>
  <text x="1120" y="1700" class="branch">no</text>
  <path d="M 1370 1766 H 1550" class="connector"/>
  <text x="1400" y="1750" class="branch">yes</text>
  <path d="M 1100 1802 V 1880" class="connector"/>
  <text x="1120" y="1850" class="branch">no</text>

  <rect x="80" y="2000" width="2040" height="42" rx="21" fill="#eef2ff"/>
  <text x="1100" y="2027" text-anchor="middle" class="branch">Why no failure yet: current paths such as '/blogs/content' are exact top-level entries, so findRoute() returns them before it needs children or recursion.</text>
  <line x1="80" y1="2070" x2="2120" y2="2070" class="rule"/>
  <text x="80" y="2095" class="source">Sources: RouterUtils.ts · dom-history.router.ts · dom-navigation.router.ts · DotaRouterService.ts · virtual route generator</text>
</svg>
