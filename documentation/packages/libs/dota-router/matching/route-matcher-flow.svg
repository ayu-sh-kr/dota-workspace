<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1840" viewBox="0 0 1800 1840" role="img" aria-labelledby="title desc">
  <title id="title">Dota Router matchRoute resolution flow</title>
  <desc id="desc">matchRoute splits a pathname, returns a root route for an empty path, and otherwise resolves every segment from the configured route tree. Literal siblings are preferred before slug siblings. Missing segments return the error route and a completely consumed path returns the last matched route with its optional render callback.</desc>
  <style>
    svg { background: #ffffff; text-rendering: geometricPrecision; }
    text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { font-size: 18px; fill: #526174; }
    .lane-title { font-size: 19px; font-weight: 700; fill: #334155; }
    .card-label { font-size: 17px; font-weight: 700; }
    .detail { font-size: 14px; fill: #526174; }
    .branch { font-size: 14px; font-weight: 700; fill: #334155; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #526174; }
    .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .card { stroke-width: 2; rx: 10; }
    .entry { fill: #eef2ff; stroke: #3157c9; }
    .process { fill: #ffffff; stroke: #cbd5e1; }
    .decision { fill: #fffaf0; stroke: #d6a24e; }
    .effect { fill: #f0fdf4; stroke: #9ac7a3; }
    .skip { fill: #f8fafc; stroke: #94a3b8; }
    .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .rule { stroke: #dbe4ee; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1800" height="1840" fill="#ffffff"/>
  <text x="80" y="70" class="title">Dota Router · matchRoute() chooses one route from a configured tree</text>
  <text x="80" y="106" class="subtitle">Each segment must match. Literal routes take precedence; slug routes are the fallback at the same tree level.</text>
  <rect x="80" y="132" width="1640" height="6" rx="3" fill="#dbe4ee"/>

  <rect x="60" y="180" width="1680" height="200" rx="24" class="lane"/>
  <text x="100" y="226" class="lane-title">01 / INPUT</text>
  <rect x="180" y="270" width="500" height="72" class="card entry"/>
  <text x="430" y="314" text-anchor="middle" class="card-label">matchRoute(path, routes, errorRoute)</text>
  <text x="180" y="365" class="code">'/blogs/new' · configured tree · ErrorPage</text>
  <rect x="1030" y="270" width="560" height="72" class="card entry"/>
  <text x="1310" y="314" text-anchor="middle" class="card-label">configured sibling routes</text>
  <text x="1030" y="365" class="code">'/new' literal before '/:slug' slug</text>

  <rect x="60" y="430" width="1680" height="1280" rx="24" class="lane"/>
  <text x="100" y="476" class="lane-title">02 / RESOLUTION</text>

  <rect x="630" y="520" width="540" height="72" class="card process"/>
  <text x="900" y="564" text-anchor="middle" class="card-label">split pathname into segments</text>
  <text x="630" y="620" class="code">'/blogs/new/' → ['blogs', 'new']</text>

  <rect x="630" y="680" width="540" height="72" class="card decision"/>
  <text x="900" y="724" text-anchor="middle" class="card-label">segments empty?</text>
  <rect x="1330" y="680" width="300" height="72" class="card decision"/>
  <text x="1480" y="724" text-anchor="middle" class="card-label">root '/' exists?</text>
  <rect x="1330" y="830" width="300" height="72" class="card effect"/>
  <text x="1480" y="874" text-anchor="middle" class="card-label">return root route</text>

  <rect x="630" y="840" width="540" height="72" class="card process"/>
  <text x="900" y="884" text-anchor="middle" class="card-label">start with top-level siblings</text>
  <text x="630" y="940" class="detail">The loop replaces siblings with the selected route's children.</text>

  <rect x="630" y="1010" width="540" height="72" class="card decision"/>
  <text x="900" y="1054" text-anchor="middle" class="card-label">literal sibling matches this segment?</text>
  <rect x="170" y="1010" width="300" height="72" class="card process"/>
  <text x="320" y="1054" text-anchor="middle" class="card-label">select literal route</text>
  <rect x="1330" y="1010" width="300" height="72" class="card decision"/>
  <text x="1480" y="1054" text-anchor="middle" class="card-label">slug sibling exists?</text>
  <rect x="1330" y="1160" width="300" height="72" class="card process"/>
  <text x="1480" y="1204" text-anchor="middle" class="card-label">select slug route</text>

  <rect x="630" y="1160" width="540" height="72" class="card process"/>
  <text x="900" y="1204" text-anchor="middle" class="card-label">advance to selected route.children</text>
  <text x="630" y="1260" class="detail">No children means the next sibling array is empty.</text>
  <rect x="630" y="1310" width="540" height="72" class="card decision"/>
  <text x="900" y="1354" text-anchor="middle" class="card-label">more path segments?</text>
  <rect x="630" y="1460" width="540" height="72" class="card effect"/>
  <text x="900" y="1504" text-anchor="middle" class="card-label">return matched route</text>

  <rect x="1330" y="1360" width="300" height="72" class="card skip"/>
  <text x="1480" y="1404" text-anchor="middle" class="card-label">return error route</text>
  <text x="1330" y="1458" class="detail">No root, literal, or slug route can consume the path.</text>

  <path d="M 430 342 V 470 H 700 V 520" class="connector"/>
  <path d="M 900 592 V 680" class="connector"/>
  <path d="M 1170 716 H 1330" class="connector"/>
  <text x="1200" y="700" class="branch">yes</text>
  <path d="M 1480 752 V 830" class="connector"/>
  <text x="1500" y="800" class="branch">yes</text>
  <path d="M 1630 716 H 1680 V 1396 H 1630" class="connector"/>
  <text x="1650" y="700" class="branch">no</text>
  <path d="M 900 752 V 840" class="connector"/>
  <text x="920" y="800" class="branch">no</text>
  <path d="M 900 912 V 1010" class="connector"/>
  <path d="M 630 1046 H 470" class="connector"/>
  <text x="500" y="1030" class="branch">yes</text>
  <path d="M 1170 1046 H 1330" class="connector"/>
  <text x="1200" y="1030" class="branch">no</text>
  <path d="M 320 1082 V 1120 H 900 V 1160" class="connector"/>
  <path d="M 1480 1082 V 1160" class="connector"/>
  <text x="1500" y="1130" class="branch">yes</text>
  <path d="M 1630 1046 H 1680 V 1396 H 1630" class="connector"/>
  <text x="1650" y="1030" class="branch">no</text>
  <path d="M 1330 1196 H 1170" class="connector"/>
  <path d="M 900 1232 V 1310" class="connector"/>
  <path d="M 900 1382 V 1460" class="connector"/>
  <text x="920" y="1428" class="branch">no</text>
  <path d="M 630 1346 H 540 V 970 H 900 V 1010" class="connector"/>
  <text x="560" y="1330" class="branch">yes · next segment</text>

  <line x1="80" y1="1760" x2="1720" y2="1760" class="rule"/>
  <text x="80" y="1785" class="detail">Source: route-matcher.ts · solid arrows are synchronous. The right-side fallback card is shared by every unsuccessful resolution branch.</text>
</svg>
