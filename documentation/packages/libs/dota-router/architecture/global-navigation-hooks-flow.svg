<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2360" width="1800" height="2360" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Proposed global navigation hooks in Dota Router</title>
  <desc id="diagram-desc">Global hooks are configured once per router instance, passed through the service and browser adapter to a coordinator, and executed around route-bound guards, rendering, and route lifecycle hooks.</desc>

  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      <![CDATA[
        svg { background: #ffffff; text-rendering: geometricPrecision; }
        text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
        .title { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; }
        .subtitle { font-size: 17px; fill: #526174; }
        .section-title { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; fill: #334155; }
        .card-label { font-size: 16px; font-weight: 700; fill: #1f2937; }
        .annotation { font-size: 14px; fill: #526174; }
        .branch { font-size: 14px; font-weight: 700; fill: #334155; }
        .legend-label { font-size: 14px; fill: #526174; }
        .source { font-size: 13px; fill: #64748b; }
        .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-solid); }
        .group-line { fill: none; stroke: #dbe4ee; stroke-width: 2; stroke-dasharray: 9 8; }
        .group-rail { fill: #dbe4ee; }
        .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
        .entry { fill: #eef2ff; stroke: #3157c9; }
        .process { fill: #ffffff; stroke: #cbd5e1; }
        .decision { fill: #fffaf0; stroke: #d6a24e; }
        .effect { fill: #f0fdf4; stroke: #9ac7a3; }
        .skip { fill: #f8fafc; stroke: #94a3b8; }
      ]]>
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="2360" fill="#ffffff"/>
  <rect x="70" y="46" width="330" height="34" rx="17" fill="#eef2ff"/>
  <text x="235" y="69" text-anchor="middle" class="section-title" fill="#3157c9">PROPOSED ROUTER LIFECYCLE</text>
  <text x="70" y="124" class="title">Dota Router · global navigation hooks</text>
  <text x="70" y="160" class="subtitle">Per-router callbacks wrap page-bound guards and lifecycle hooks without entering the route tree.</text>
  <rect x="70" y="184" width="1660" height="6" rx="3" fill="#dbe4ee"/>

  <!-- Open configuration group -->
  <rect x="56" y="220" width="10" height="274" rx="5" class="group-rail"/>
  <path d="M 66 220 H 1730 M 66 494 H 1730" class="group-line"/>
  <text x="86" y="246" class="section-title">01 / CONFIGURATION AND OWNERSHIP</text>

  <rect x="100" y="300" width="400" height="64" class="card entry"/>
  <text x="300" y="339" text-anchor="middle" class="card-label">DefaultRouterConfig.globalHooks</text>
  <text x="300" y="390" text-anchor="middle" class="annotation">beforeEach[] · afterEach[]</text>

  <rect x="700" y="300" width="400" height="64" class="card process"/>
  <text x="900" y="339" text-anchor="middle" class="card-label">DotaRouterService retains hooks</text>
  <text x="900" y="390" text-anchor="middle" class="annotation">one collection for one initialized router</text>

  <rect x="1300" y="300" width="400" height="64" class="card process"/>
  <text x="1500" y="339" text-anchor="middle" class="card-label">adapter passes hooks to coordinator</text>
  <text x="1500" y="390" text-anchor="middle" class="annotation">History and Navigation API share the policy</text>

  <path d="M 500 332 H 700" class="connector"/>
  <path d="M 1100 332 H 1300" class="connector"/>

  <!-- Open runtime group -->
  <rect x="56" y="540" width="10" height="1538" rx="5" class="group-rail"/>
  <path d="M 66 540 H 1730 M 66 2078 H 1730" class="group-line"/>
  <text x="86" y="568" class="section-title">02 / ONE RESOLVED NAVIGATION ATTEMPT</text>

  <rect x="700" y="620" width="400" height="64" class="card entry"/>
  <text x="900" y="659" text-anchor="middle" class="card-label">coordinator navigation entry</text>
  <text x="160" y="656" class="annotation">initial, programmatic, popstate, or intercepted navigation</text>

  <rect x="700" y="790" width="400" height="64" class="card process"/>
  <text x="900" y="829" text-anchor="middle" class="card-label">resolve + create context + branch delta</text>
  <text x="160" y="818" class="annotation">route-transition.ts remains pure</text>
  <text x="160" y="840" class="annotation">one NavigationContext is shared by every callback</text>

  <rect x="700" y="960" width="400" height="64" class="card decision"/>
  <text x="900" y="999" text-anchor="middle" class="card-label">run global beforeEach guards</text>
  <text x="160" y="988" class="annotation">once per attempt, independent of BranchDelta</text>
  <text x="160" y="1010" class="annotation">registration order · stop at first non-true result</text>

  <rect x="1250" y="960" width="400" height="64" class="card skip"/>
  <text x="1450" y="999" text-anchor="middle" class="card-label">cancelled or redirected result</text>
  <text x="1450" y="1050" text-anchor="middle" class="annotation">no page guard, commit, render, or afterEach</text>

  <rect x="700" y="1130" width="400" height="64" class="card decision"/>
  <text x="900" y="1169" text-anchor="middle" class="card-label">run route guard phases</text>
  <text x="160" y="1158" class="annotation">beforeLeave: deepest first</text>
  <text x="160" y="1180" class="annotation">beforeEnter: parent first</text>

  <rect x="1250" y="1130" width="400" height="64" class="card skip"/>
  <text x="1450" y="1169" text-anchor="middle" class="card-label">cancelled or redirected result</text>
  <text x="1450" y="1220" text-anchor="middle" class="annotation">global afterEach does not observe rejected transitions</text>

  <rect x="700" y="1300" width="400" height="64" class="card process"/>
  <text x="900" y="1339" text-anchor="middle" class="card-label">adapter commit boundary</text>
  <text x="160" y="1328" class="annotation">History: pushState / replaceState</text>
  <text x="160" y="1350" class="annotation">Navigation API: browser commits after precommit</text>

  <rect x="700" y="1470" width="400" height="64" class="card effect"/>
  <text x="900" y="1509" text-anchor="middle" class="card-label">render + set currentMatch</text>
  <text x="160" y="1506" class="annotation">the approved match becomes coordinator state</text>

  <rect x="700" y="1640" width="400" height="64" class="card process"/>
  <text x="900" y="1679" text-anchor="middle" class="card-label">run route after-hooks</text>
  <text x="160" y="1668" class="annotation">afterLeave: deepest first</text>
  <text x="160" y="1690" class="annotation">afterEnter: parent first</text>

  <rect x="700" y="1810" width="400" height="64" class="card process"/>
  <text x="900" y="1849" text-anchor="middle" class="card-label">run global afterEach hooks</text>
  <text x="160" y="1838" class="annotation">once after render and page effects</text>
  <text x="160" y="1860" class="annotation">observational; cannot cancel a committed route</text>

  <rect x="1250" y="1810" width="400" height="64" class="card skip"/>
  <text x="1450" y="1849" text-anchor="middle" class="card-label">failed result after commit</text>
  <text x="1450" y="1900" text-anchor="middle" class="annotation">a rejected after-hook does not roll back URL or DOM</text>

  <rect x="700" y="1980" width="400" height="64" class="card effect"/>
  <text x="900" y="2019" text-anchor="middle" class="card-label">completed NavigationResult</text>

  <!-- Configuration-to-runtime handoff -->
  <path d="M 1500 364 V 510 H 900 V 620" class="connector"/>

  <!-- Runtime spine -->
  <path d="M 900 684 V 790" class="connector"/>
  <path d="M 900 854 V 960" class="connector"/>
  <path d="M 900 1024 V 1130" class="connector"/>
  <text x="918" y="1080" class="branch">allow</text>
  <path d="M 1100 992 H 1250" class="connector"/>
  <text x="1124" y="976" class="branch">false / redirect</text>
  <path d="M 900 1194 V 1300" class="connector"/>
  <text x="918" y="1250" class="branch">allow</text>
  <path d="M 1100 1162 H 1250" class="connector"/>
  <text x="1124" y="1146" class="branch">false / redirect</text>
  <path d="M 900 1364 V 1470" class="connector"/>
  <path d="M 900 1534 V 1640" class="connector"/>
  <path d="M 900 1704 V 1810" class="connector"/>
  <path d="M 900 1874 V 1980" class="connector"/>
  <text x="918" y="1930" class="branch">resolved</text>
  <path d="M 1100 1842 H 1250" class="connector"/>
  <text x="1124" y="1826" class="branch">rejects</text>

  <!-- Legend -->
  <text x="70" y="2150" class="section-title">LEGEND</text>
  <rect x="70" y="2182" width="132" height="44" class="card entry"/>
  <text x="136" y="2210" text-anchor="middle" class="legend-label">entry</text>
  <rect x="250" y="2182" width="132" height="44" class="card process"/>
  <text x="316" y="2210" text-anchor="middle" class="legend-label">processing</text>
  <rect x="430" y="2182" width="132" height="44" class="card decision"/>
  <text x="496" y="2210" text-anchor="middle" class="legend-label">guard</text>
  <rect x="610" y="2182" width="132" height="44" class="card effect"/>
  <text x="676" y="2210" text-anchor="middle" class="legend-label">effect / success</text>
  <rect x="790" y="2182" width="132" height="44" class="card skip"/>
  <text x="856" y="2210" text-anchor="middle" class="legend-label">terminal result</text>
  <path d="M 980 2204 H 1100" class="connector"/>
  <text x="1120" y="2210" class="legend-label">synchronous / awaited flow</text>
  <path d="M 1380 2182 H 1510 M 1380 2226 H 1510" class="group-line"/>
  <rect x="1370" y="2182" width="8" height="44" rx="4" class="group-rail"/>
  <text x="1530" y="2210" class="legend-label">logical group</text>

  <text x="70" y="2292" class="source">Current source: Types.ts · route-transition.ts · navigation-lifecycle.ts · HistoryCoordinator.ts · NavigationCoordinator.ts</text>
  <text x="70" y="2320" class="source">Proposal boundary: globalHooks is not implemented; page-bound route hooks remain unchanged.</text>
</svg>
