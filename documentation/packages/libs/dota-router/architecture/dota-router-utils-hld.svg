<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 3000" width="1600" height="3000" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Route Renderer · RouterUtils high-level design</title>
  <desc id="diagram-desc">createRouteRenderer creates a coordinator-compatible RouteRenderer; renderRoute resolves root metadata, handles route.render, SSR warn on initial overwrite, and writes the matched component tag.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      <![CDATA[
        svg { background: #ffffff; text-rendering: geometricPrecision; }
        text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
        .title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
        .subtitle { font-size: 17px; fill: #64748b; }
        .section { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; fill: #0f766e; }
        .label { font-size: 16px; font-weight: 700; fill: #1f2937; }
        .entry-label { fill: #ffffff; }
        .note { font-size: 14px; fill: #64748b; }
        .branch { font-size: 14px; font-weight: 700; fill: #475569; }
        .source { font-size: 13px; fill: #64748b; }
        .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
        .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
        .card { width: 360px; height: 64px; rx: 10; stroke-width: 2; }
        .entry { fill: #0f766e; stroke: #0f766e; }
        .process { fill: #ffffff; stroke: #cbd5e1; }
        .decision { fill: #fffaf0; stroke: #d6a24e; }
        .effect { fill: #f0fdf4; stroke: #9ac7a3; }
        .skip { fill: #f8fafc; stroke: #94a3b8; }
        .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      ]]>
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="3000" fill="#ffffff"/>
  <rect x="50" y="42" width="230" height="28" rx="14" fill="#e9f7f5"/>
  <text x="165" y="61" text-anchor="middle" class="section">UTILS HLD</text>
  <text x="50" y="112" class="title">RouterUtils</text>
  <text x="50" y="144" class="subtitle">Route-tree preparation, pathname matching, and DOM rendering decisions</text>
  <line x1="50" y1="174" x2="1550" y2="174" stroke="#dbe4ee" stroke-width="1.5"/>

  <rect x="50" y="205" width="1500" height="625" rx="18" class="frame"/>
  <rect x="50" y="205" width="6" height="625" rx="3" fill="#0f766e"/>
  <text x="85" y="250" class="section">01 / PREPARE ROUTES FROM COMPONENTS</text>
  <text x="85" y="278" class="note">Used by DotaRouterService when config.routes is not supplied.</text>

  <rect x="620" y="340" width="360" height="64" class="card entry"/>
  <text x="800" y="380" text-anchor="middle" class="label entry-label">prepareConfig(elements)</text>
  <rect x="620" y="495" width="360" height="64" class="card process"/>
  <text x="800" y="535" text-anchor="middle" class="label">extract Route metadata</text>
  <text x="800" y="584" text-anchor="middle" class="note">routeMap keyed by config.path</text>
  <rect x="620" y="650" width="360" height="64" class="card process"/>
  <text x="800" y="690" text-anchor="middle" class="label">root “/” + addRoute recursion</text>
  <text x="800" y="739" text-anchor="middle" class="note">flat component routes become a hierarchy</text>

  <path d="M 800 404 V 495" class="connector"/>
  <path d="M 800 559 V 650" class="connector"/>

  <rect x=”50” y=”880” width=”1500” height=”1840” rx=”18” class=”frame”/>
  <rect x=”50” y=”880” width=”6” height=”1840” rx=”3” fill=”#0f766e”/>
  <text x=”85” y=”925” class=”section”>02 / RESOLVE AND RENDER</text>
  <text x=”85” y=”953” class=”note”>The coordinator calls createRouteRenderer once, then renderRoute per navigation supplying root, match, and context.</text>

  <!-- Entry cards -->
  <rect x=”500” y=”990” width=”360” height=”64” class=”card entry”/>
  <text x=”680” y=”1030” text-anchor=”middle” class=”label entry-label”>createRouteRenderer(root)</text>
  <text x=”680” y=”1070” text-anchor=”middle” class=”note”>returns RouteRenderer for coordinator</text>

  <rect x=”500” y=”1100” width=”360” height=”64” class=”card entry”/>
  <text x=”680” y=”1140” text-anchor=”middle” class=”label entry-label”>renderRoute(root, match, ctx)</text>
  <text x=”680” y=”1180” text-anchor=”middle” class=”note”>called per navigation by coordinator</text>

  <!-- Decision 1: root metadata found? -->
  <rect x=”500” y=”1220” width=”360” height=”64” class=”card decision”/>
  <text x=”680” y=”1260” text-anchor=”middle” class=”label”>root metadata found?</text>
  <rect x=”1000” y=”1220” width=”360” height=”64” class=”card skip”/>
  <text x=”1180” y=”1260” text-anchor=”middle” class=”label”>reportRenderError → return</text>
  <text x=”1180” y=”1300” text-anchor=”middle” class=”note”>warn or throw per options.onError</text>

  <!-- Decision 2: root element in DOM? -->
  <rect x=”500” y=”1380” width=”360” height=”64” class=”card decision”/>
  <text x=”680” y=”1420” text-anchor=”middle” class=”label”>root element in DOM?</text>
  <rect x=”1000” y=”1380” width=”360” height=”64” class=”card skip”/>
  <text x=”1180” y=”1420” text-anchor=”middle” class=”label”>reportRenderError → return</text>
  <text x=”1180” y=”1460” text-anchor=”middle” class=”note”>root element not mounted</text>

  <!-- Decision 3: initial + marked server output? -->
  <rect x=”500” y=”1540” width=”360” height=”64” class=”card decision”/>
  <text x=”680” y=”1580” text-anchor=”middle” class=”label”>initial + marked server output?</text>
  <rect x=”1000” y=”1540” width=”360” height=”64” class=”card skip”/>
  <text x=”1180” y=”1580” text-anchor=”middle” class=”label”>console.warn</text>
  <text x=”1180” y=”1620” text-anchor=”middle” class=”note”>SSR output will be overwritten</text>

  <!-- route.seo side branch -->
  <rect x=”500” y=”1700” width=”360” height=”64” class=”card decision”/>
  <text x=”680” y=”1740” text-anchor=”middle” class=”label”>route.seo?</text>
  <rect x=”1000” y=”1700” width=”360” height=”64” class=”card effect”/>
  <text x=”1180” y=”1740” text-anchor=”middle” class=”label”>updateDocumentSEO(seo)</text>
  <text x=”1180” y=”1780” text-anchor=”middle” class=”note”>sets title, meta tags</text>

  <!-- Decision 4: route.render? -->
  <rect x=”500” y=”1860” width=”360” height=”64” class=”card decision”/>
  <text x=”680” y=”1900” text-anchor=”middle” class=”label”>route.render?</text>
  <rect x=”1000” y=”1860” width=”360” height=”64” class=”card effect”/>
  <text x=”1180” y=”1900” text-anchor=”middle” class=”label”>route.render(pathname)</text>
  <text x=”1180” y=”1940” text-anchor=”middle” class=”note”>custom rendering owns the DOM effect → return</text>

  <!-- Decision 5: component metadata? -->
  <rect x=”500” y=”2020” width=”360” height=”64” class=”card decision”/>
  <text x=”680” y=”2060” text-anchor=”middle” class=”label”>component metadata?</text>
  <rect x=”1000” y=”2020” width=”360” height=”64” class=”card skip”/>
  <text x=”1180” y=”2060” text-anchor=”middle” class=”label”>reportRenderError → return</text>
  <text x=”1180” y=”2100” text-anchor=”middle” class=”note”>no component for matched route</text>

  <!-- Final effect -->
  <rect x=”500” y=”2180” width=”360” height=”64” class=”card effect”/>
  <text x=”680” y=”2220” text-anchor=”middle” class=”label”>rootElement.innerHTML =</text>
  <text x=”680” y=”2256” text-anchor=”middle” class=”note”>&lt;selector path=”...”&gt;</text>

  <!-- Connectors Section 02 -->
  <path d=”M 680 1054 V 1100” class=”connector”/>
  <path d=”M 680 1164 V 1220” class=”connector”/>
  <path d=”M 860 1252 H 1000” class=”connector”/>
  <text x=”882” y=”1236” class=”branch”>no</text>
  <path d=”M 680 1284 V 1380” class=”connector”/>
  <text x=”700” y=”1334” class=”branch”>yes</text>
  <path d=”M 860 1412 H 1000” class=”connector”/>
  <text x=”882” y=”1396” class=”branch”>no</text>
  <path d=”M 680 1444 V 1540” class=”connector”/>
  <text x=”700” y=”1494” class=”branch”>yes</text>
  <path d=”M 860 1572 H 1000” class=”connector”/>
  <text x=”882” y=”1556” class=”branch”>yes</text>
  <path d=”M 680 1604 V 1700” class=”connector”/>
  <text x=”700” y=”1654” class=”branch”>no</text>
  <path d=”M 860 1732 H 1000” class=”connector”/>
  <text x=”882” y=”1716” class=”branch”>yes</text>
  <path d=”M 680 1764 V 1860” class=”connector”/>
  <text x=”700” y=”1814” class=”branch”>no / after SEO</text>
  <path d=”M 860 1892 H 1000” class=”connector”/>
  <text x=”882” y=”1876” class=”branch”>yes</text>
  <path d=”M 680 1924 V 2020” class=”connector”/>
  <text x=”700” y=”1974” class=”branch”>no</text>
  <path d=”M 860 2052 H 1000” class=”connector”/>
  <text x=”882” y=”2036” class=”branch”>no</text>
  <path d=”M 680 2084 V 2180” class=”connector”/>
  <text x=”700” y=”2134” class=”branch”>yes</text>

  <rect x=”85” y=”2360” width=”1430” height=”125” rx=”12” class=”lane”/>
  <text x=”115” y=”2402” class=”section”>PATH HELPERS</text>
  <text x=”260” y=”2402” class=”note”>getCurrentPath() reads window.location.pathname.</text>
  <text x=”260” y=”2430” class=”note”>getPreviousPath() reads the Navigation API entry list; getNextPath(), getParentPath(), and isParent() support path calculations.</text>
  <text x=”85” y=”2530” class=”source”>Source: packages/libs/dota-router/src/coordinator/route-renderer.ts · Types.ts</text>
  <text x=”85” y=”2557” class=”source”>Related: dota-router-service-hld.svg · dota-router-adapters-hld.svg</text>
</svg>
