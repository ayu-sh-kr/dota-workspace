<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 2200" width="2200" height="2200" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Dota Router navigation adapters high-level design</title>
  <desc id="diagram-desc">Alternative History API and Navigation API router adapters normalize navigation, respond to browser events, and converge on shared coordinator route-transition semantics and rendering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      <![CDATA[
        svg { background: #ffffff; text-rendering: geometricPrecision; }
        text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
        .title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
        .subtitle { font-size: 17px; fill: #64748b; }
        .section { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; fill: #7c3aed; }
        .lane-title { font-size: 19px; font-weight: 700; fill: #334155; }
        .label { font-size: 15px; font-weight: 700; fill: #1f2937; }
        .entry-label { fill: #ffffff; }
        .note { font-size: 14px; fill: #64748b; }
        .branch { font-size: 14px; font-weight: 700; fill: #475569; }
        .source { font-size: 13px; fill: #64748b; }
        .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
        .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
        .history { fill: #f8fbff; stroke: #d6e3f4; stroke-width: 1.5; }
        .navigation { fill: #fbf9ff; stroke: #e6ddf5; stroke-width: 1.5; }
        .card { width: 360px; height: 64px; rx: 10; stroke-width: 2; }
        .entry { fill: #7c3aed; stroke: #7c3aed; }
        .process { fill: #ffffff; stroke: #cbd5e1; }
        .decision { fill: #fffaf0; stroke: #d6a24e; }
        .effect { fill: #f0fdf4; stroke: #9ac7a3; }
        .skip { fill: #f8fafc; stroke: #94a3b8; }
        .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
        .connector-async { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 9 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-async); }
        .plain { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      ]]>
    </style>
  </defs>

  <rect x="0" y="0" width="2200" height="2200" fill="#ffffff"/>
  <rect x="50" y="42" width="260" height="28" rx="14" fill="#f3efff"/>
  <text x="180" y="61" text-anchor="middle" class="section">ADAPTERS HLD</text>
  <text x="50" y="112" class="title">Dota Router navigation adapters</text>
  <text x="50" y="144" class="subtitle">History API and Navigation API alternatives with a shared rendering boundary</text>
  <line x1="50" y1="174" x2="2150" y2="174" stroke="#dbe4ee" stroke-width="1.5"/>

  <rect x="50" y="205" width="2100" height="1480" rx="18" class="frame"/>
  <rect x="50" y="205" width="6" height="1480" rx="3" fill="#7c3aed"/>
  <text x="85" y="250" class="section">01 / ALTERNATIVE ADAPTERS</text>
  <text x="85" y="278" class="note">DotaRouterService selects one constructor; the two lanes document the available implementations.</text>

  <rect x="60" y="315" width="920" height="1240" rx="16" class="history"/>
  <rect x="1220" y="315" width="920" height="1240" rx="16" class="navigation"/>
  <rect x="100" y="350" width="245" height="30" rx="15" fill="#e5f0ff"/>
  <text x="222" y="371" text-anchor="middle" class="lane-title">DomHistoryRouter</text>
  <text x="100" y="408" class="note">History API · pushState + popstate</text>
  <rect x="1260" y="350" width="275" height="30" rx="15" fill="#eee6ff"/>
  <text x="1397" y="371" text-anchor="middle" class="lane-title">DomNavigationRouter</text>
  <text x="1260" y="408" class="note">Navigation API · navigate + intercept</text>

  <rect x="100" y="470" width="360" height="64" class="card process"/>
  <text x="280" y="510" text-anchor="middle" class="label">new DomHistoryRouter(...)</text>
  <rect x="100" y="630" width="360" height="64" class="card process"/>
  <text x="280" y="670" text-anchor="middle" class="label">init(): register popstate</text>
  <rect x="560" y="790" width="360" height="64" class="card process"/>
  <text x="740" y="830" text-anchor="middle" class="label">initial pathname → render</text>
  <text x="740" y="879" text-anchor="middle" class="note">constructor reads window.location.pathname</text>
  <rect x="100" y="790" width="360" height="64" class="card effect"/>
  <text x="280" y="830" text-anchor="middle" class="label">route(path) → pushState</text>
  <text x="280" y="879" text-anchor="middle" class="note">normalize slash; dispatch popstate</text>
  <rect x="100" y="970" width="360" height="64" class="card process"/>
  <text x="280" y="1010" text-anchor="middle" class="label">popstate event → render</text>
  <text x="280" y="1059" text-anchor="middle" class="note">preventDefault(); read pathname</text>

  <rect x="1260" y="470" width="360" height="64" class="card process"/>
  <text x="1440" y="510" text-anchor="middle" class="label">new DomNavigationRouter(...)</text>
  <rect x="1260" y="630" width="360" height="64" class="card process"/>
  <text x="1440" y="670" text-anchor="middle" class="label">init(): register navigate</text>
  <rect x="1720" y="790" width="360" height="64" class="card process"/>
  <text x="1900" y="830" text-anchor="middle" class="label">initial pathname → render</text>
  <text x="1900" y="879" text-anchor="middle" class="note">constructor reads window.location.pathname</text>
  <rect x="1260" y="790" width="360" height="64" class="card effect"/>
  <text x="1440" y="830" text-anchor="middle" class="label">route(path) → navigate(url)</text>
  <text x="1440" y="879" text-anchor="middle" class="note">normalize leading slash</text>
  <rect x="1260" y="970" width="360" height="64" class="card decision"/>
  <text x="1440" y="1010" text-anchor="middle" class="label">can intercept &amp;&amp; safe request?</text>
  <text x="1440" y="1059" text-anchor="middle" class="note">not a hash change or download</text>
  <rect x="1720" y="970" width="360" height="64" class="card skip"/>
  <text x="1900" y="1010" text-anchor="middle" class="label">ignore navigation event</text>
  <rect x="1260" y="1140" width="360" height="64" class="card process"/>
  <text x="1440" y="1180" text-anchor="middle" class="label">intercept({handler})</text>
  <text x="1660" y="1229" text-anchor="start" class="note">async handler calls render</text>

  <path d="M 280 534 V 630" class="connector"/>
  <path d="M 460 662 H 500 V 822 H 560" class="connector"/>
  <path d="M 280 694 V 790" class="connector"/>
  <path d="M 280 854 V 970" class="connector"/>
  <path d="M 1440 534 V 630" class="connector"/>
  <path d="M 1620 662 H 1660 V 822 H 1720" class="connector"/>
  <path d="M 1440 694 V 790" class="connector"/>
  <path d="M 1440 854 V 970" class="connector"/>
  <path d="M 1620 1002 H 1720" class="connector"/>
  <text x="1645" y="986" class="branch">no</text>
  <path d="M 1440 1034 V 1140" class="connector"/>
  <text x="1460" y="1094" class="branch">yes</text>

  <text x="85" y="1465" class="section">02 / SHARED RENDER BOUNDARY</text>
  <text x="85" y="1493" class="note">Initial loads and accepted navigation events converge at coordinator transition semantics and rendering.</text>
  <rect x="920" y="1580" width="360" height="64" class="card entry"/>
  <text x="1100" y="1612" text-anchor="middle" class="label entry-label">coordinator transition</text>
  <text x="1100" y="1635" text-anchor="middle" class="label entry-label">+ render approved route</text>

  <path d="M 920 822 H 950 V 1390 H 1100 V 1580" class="plain"/>
  <path d="M 280 1034 V 1430 H 1100 V 1580" class="plain"/>
  <path d="M 2080 822 H 2120 V 1370 H 1100 V 1580" class="plain"/>
  <path d="M 1440 1204 V 1430 H 1100 V 1580" class="connector-async"/>
  <circle cx="1100" cy="1530" r="7" fill="#7c3aed"/>
  <path d="M 1100 1530 V 1580" class="connector"/>

  <rect x="85" y="1730" width="2030" height="110" rx="12" class="lane"/>
  <text x="115" y="1772" class="section">READING NOTE</text>
  <text x="285" y="1772" class="note">History always dispatches popstate after pushState. Navigation intercepts only safe, interceptable events.</text>
  <text x="285" y="1800" class="note">Dashed purple control is the async Navigation API handler; all four paths end at the shared renderer.</text>
  <text x="85" y="1895" class="source">Source: packages/libs/dota-router/src/router/history/dom-history.router.ts · router/dom-navigation.router.ts · coordinator/route-transition.ts</text>
  <text x="85" y="1922" class="source">Related: transition-layer-comparison.svg · dota-router-service-hld.svg · dota-router-utils-hld.svg</text>
</svg>
