<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1800" viewBox="0 0 2200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Dota Router route configuration producers and selection</title>
  <desc id="desc">The build-time virtual routeConfig export and the runtime RouterUtils.prepareConfig fallback are two producers of RouteConfig arrays. DotaRouterService selects the supplied routeConfig when it is non-empty; only otherwise does it reflect component metadata and build a hierarchy.</desc>

  <style>
    svg { background: #ffffff; text-rendering: geometricPrecision; }
    text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { font-size: 18px; fill: #526174; }
    .lane-title { font-size: 20px; font-weight: 700; fill: #334155; }
    .lane-note { font-size: 15px; fill: #64748b; }
    .card-label { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .annotation { font-size: 14px; fill: #526174; }
    .branch { font-size: 14px; font-weight: 700; fill: #334155; }
    .terminal { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .source { font-size: 13px; fill: #64748b; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #526174; }
    .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
    .entry { fill: #eef2ff; stroke: #3157c9; }
    .process { fill: #ffffff; stroke: #cbd5e1; }
    .decision { fill: #fffaf0; stroke: #d6a24e; }
    .effect { fill: #f0fdf4; stroke: #9ac7a3; }
    .skip { fill: #f8fafc; stroke: #94a3b8; }
    .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-plain { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .rule { stroke: #dbe4ee; stroke-width: 1.5; }
    .legend { font-size: 14px; fill: #526174; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="2200" height="1800" fill="#ffffff"/>
  <text x="80" y="70" class="title">Dota Router · two route-config producers</text>
  <text x="80" y="106" class="subtitle">Build-time route imports and runtime decorator metadata have the same RouteConfig vocabulary, but different shape and selection rules.</text>
  <rect x="80" y="132" width="2040" height="6" rx="3" fill="#dbe4ee"/>

  <rect x="60" y="180" width="980" height="650" rx="24" class="lane"/>
  <rect x="1160" y="180" width="980" height="650" rx="24" class="lane"/>
  <rect x="60" y="880" width="2080" height="760" rx="24" class="lane"/>

  <text x="100" y="228" class="lane-title">01 / BUILD-TIME PRODUCER</text>
  <text x="100" y="257" class="lane-note">dota-vite-preloader scans exported page classes before the app runs.</text>
  <text x="1200" y="228" class="lane-title">02 / RUNTIME FALLBACK PRODUCER</text>
  <text x="1200" y="257" class="lane-note">prepareConfig() reads metadata placed on component constructors by @Route.</text>
  <text x="100" y="928" class="lane-title">03 / ROUTER SERVICE SELECTION</text>
  <text x="100" y="957" class="lane-note">Only one route collection is handed to the active router instance.</text>

  <rect x="130" y="310" width="360" height="72" class="card entry"/>
  <text x="310" y="354" text-anchor="middle" class="card-label">@Route page source</text>
  <text x="130" y="412" class="code">@Route({ path: '/blogs/content' })</text>

  <rect x="130" y="470" width="360" height="72" class="card process"/>
  <text x="310" y="514" text-anchor="middle" class="card-label">AST scan + candidate extraction</text>
  <text x="130" y="572" class="annotation">exported class + path + optional default/render</text>

  <rect x="130" y="630" width="360" height="72" class="card effect"/>
  <text x="310" y="674" text-anchor="middle" class="card-label">virtual:dota-routes</text>
  <text x="130" y="732" class="code">RouteConfig[] · flat entries · direct imports</text>

  <path d="M 310 382 V 470" class="connector"/>
  <path d="M 310 542 V 630" class="connector"/>

  <rect x="1230" y="310" width="360" height="72" class="card entry"/>
  <text x="1410" y="354" text-anchor="middle" class="card-label">@Route decorator executes</text>
  <text x="1230" y="412" class="code">Reflect.defineMetadata('Route', config)</text>

  <rect x="1230" y="470" width="360" height="72" class="card process"/>
  <text x="1410" y="514" text-anchor="middle" class="card-label">prepareConfig(elements)</text>
  <text x="1230" y="572" class="annotation">metadata → Map by path → root '/' → addRoute recursion</text>

  <rect x="1230" y="630" width="360" height="72" class="card effect"/>
  <text x="1410" y="674" text-anchor="middle" class="card-label">hierarchical RouteConfig[]</text>
  <text x="1230" y="732" class="code">top-level routes + children + UnknownComponent</text>

  <path d="M 1410 382 V 470" class="connector"/>
  <path d="M 1410 542 V 630" class="connector"/>

  <rect x="830" y="1000" width="440" height="72" class="card entry"/>
  <text x="1050" y="1044" text-anchor="middle" class="card-label">DotaRouterService.fromComponents(config)</text>

  <rect x="830" y="1150" width="440" height="72" class="card decision"/>
  <text x="1050" y="1194" text-anchor="middle" class="card-label">config.routes supplied &amp; non-empty?</text>

  <rect x="250" y="1320" width="440" height="72" class="card effect"/>
  <text x="470" y="1364" text-anchor="middle" class="card-label">use supplied routeConfig</text>
  <text x="250" y="1422" class="annotation">current dota-web path: routes = virtual:dota-routes</text>

  <rect x="1450" y="1320" width="440" height="72" class="card process"/>
  <text x="1670" y="1364" text-anchor="middle" class="card-label">call prepareConfig(components)</text>
  <text x="1450" y="1422" class="annotation">fallback when routes is omitted or []</text>

  <rect x="830" y="1510" width="440" height="72" class="card effect"/>
  <text x="1050" y="1554" text-anchor="middle" class="card-label">new DotaRouterService(...)</text>
  <text x="830" y="1612" class="annotation">stores the selected _routes, fallbacks, root, and router constructor</text>

  <path d="M 310 702 V 820 H 720 V 1036 H 830" class="connector-plain"/>
  <path d="M 1410 702 V 820 H 1380 V 1036 H 1270" class="connector-plain"/>
  <path d="M 1050 1072 V 1150" class="connector"/>
  <path d="M 830 1186 H 720 V 1356 H 690" class="connector"/>
  <text x="750" y="1210" class="branch">yes</text>
  <path d="M 1270 1186 H 1380 V 1356 H 1450" class="connector"/>
  <text x="1290" y="1210" class="branch">no</text>
  <path d="M 470 1392 V 1450 H 750 V 1546 H 830" class="connector"/>
  <path d="M 1670 1392 V 1450 H 1350 V 1546 H 1270" class="connector"/>

  <rect x="80" y="1665" width="2040" height="42" rx="21" fill="#eef2ff"/>
  <text x="1100" y="1692" text-anchor="middle" class="branch">Same RouteConfig vocabulary; different producer: generated array is flat, prepareConfig() can create children.</text>
  <line x1="80" y1="1725" x2="2120" y2="1725" class="rule"/>
  <text x="80" y="1775" class="source">Sources: dota-vite-preloader route-candidate.domain.ts · dota-router route.decorator.ts · RouterUtils.ts · DotaRouterService.ts · dota-wrap/index.ts</text>
</svg>
