<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1410" viewBox="0 0 1800 1410" role="img" aria-labelledby="title desc">
  <title id="title">Event map generator plugin flow</title>
  <desc id="desc">The Vite plugin resolves its root during setup, regenerates the declaration file on build start, and in dev mode listens for add, change, and unlink events. When a watched file is a TypeScript source and not a declaration file, the scanner discovers event names, the generator writes the module augmentation, and the dev watcher triggers a full reload.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap');
      text { font-family: 'DM Sans', 'Poppins', 'Helvetica', 'Arial', sans-serif; text-rendering: geometricPrecision; }
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #526174; }
      .lane-title { font-size: 16px; font-weight: 700; fill: #334155; }
      .card-label { font-size: 16px; font-weight: 700; fill: #1f2937; }
      .card-note { font-size: 11px; fill: #526174; }
      .branch-label { font-size: 14px; font-weight: 700; fill: #334155; }
      .source-note { font-size: 12px; fill: #526174; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1410" fill="#ffffff"/>

  <text class="title" x="60" y="38">Event map generator scaffold flow</text>
  <text class="subtitle" x="60" y="60">Current behavior: scan event names, emit a declaration file, and refresh the dev server when relevant source files change.</text>

  <rect x="80" y="88" width="640" height="560" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="980" y="88" width="740" height="980" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <text class="lane-title" x="110" y="116">Build start path</text>
  <text class="lane-title" x="1010" y="116">Dev server path</text>

  <rect x="150" y="136" width="360" height="54" rx="14" fill="#eef2ff" stroke="#3157c9" stroke-width="2"/>
  <text class="card-label" x="330" y="168" text-anchor="middle">buildStart()</text>
  <text class="card-note" x="330" y="195" text-anchor="middle">eager regeneration at startup</text>

  <rect x="150" y="280" width="360" height="54" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="card-label" x="330" y="312" text-anchor="middle">scanEventMapSources()</text>
  <text class="card-note" x="330" y="339" text-anchor="middle">glob ./src/**/*.ts → readFile → SWC parse</text>
  <text class="card-note" x="330" y="353" text-anchor="middle">collect @OnEvent and publish/publishAsync names; dedupe; sort</text>

  <rect x="150" y="424" width="360" height="54" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="card-label" x="330" y="456" text-anchor="middle">createDeclaration()</text>
  <text class="card-note" x="330" y="483" text-anchor="middle">unique names → declare module "@ayu-sh-kr/dota-wrap/event"</text>
  <text class="card-note" x="330" y="497" text-anchor="middle">emits ApplicationEventMap entries with unknown payloads</text>

  <rect x="150" y="568" width="360" height="54" rx="14" fill="#f0fdf4" stroke="#9ac7a3" stroke-width="2"/>
  <text class="card-label" x="330" y="600" text-anchor="middle">writeFile(outFile)</text>
  <text class="card-note" x="330" y="627" text-anchor="middle">writes the generated declaration relative to root</text>

  <path d="M 330 190 V 280" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 330 334 V 424" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 330 478 V 568" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1030" y="136" width="360" height="54" rx="14" fill="#eef2ff" stroke="#3157c9" stroke-width="2"/>
  <text class="card-label" x="1210" y="168" text-anchor="middle">configureServer()</text>
  <text class="card-note" x="1210" y="195" text-anchor="middle">registers dev watcher callbacks</text>

  <rect x="1030" y="280" width="360" height="54" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="card-label" x="1210" y="312" text-anchor="middle">watcher.on(...)</text>
  <text class="card-note" x="1210" y="339" text-anchor="middle">add / change / unlink fan in here</text>

  <rect x="1030" y="424" width="360" height="54" rx="14" fill="#fffaf0" stroke="#d6a24e" stroke-width="2"/>
  <text class="card-label" x="1210" y="456" text-anchor="middle">shouldRebuild(file)?</text>
  <text class="card-note" x="1210" y="483" text-anchor="middle">file endsWith('.ts') &amp;&amp; !file.endsWith('.d.ts')</text>

  <rect x="1450" y="424" width="180" height="54" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text class="card-label" x="1540" y="456" text-anchor="middle">ignore</text>
  <text class="card-note" x="1540" y="483" text-anchor="middle">non-.ts or .d.ts file</text>

  <rect x="1030" y="568" width="360" height="54" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="card-label" x="1210" y="600" text-anchor="middle">scanEventMapSources()</text>
  <text class="card-note" x="1210" y="627" text-anchor="middle">same discovery pipeline as build start</text>
  <text class="card-note" x="1210" y="641" text-anchor="middle">dedupe by kind:name before generation</text>

  <rect x="1030" y="712" width="360" height="54" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="card-label" x="1210" y="744" text-anchor="middle">createDeclaration()</text>
  <text class="card-note" x="1210" y="771" text-anchor="middle">same output shape: module augmentation with unknown payloads</text>

  <rect x="1030" y="856" width="360" height="54" rx="14" fill="#f0fdf4" stroke="#9ac7a3" stroke-width="2"/>
  <text class="card-label" x="1210" y="888" text-anchor="middle">writeFile(outFile)</text>
  <text class="card-note" x="1210" y="915" text-anchor="middle">dev path writes first, then sends a full reload</text>

  <rect x="1030" y="1000" width="360" height="54" rx="14" fill="#f0fdf4" stroke="#9ac7a3" stroke-width="2"/>
  <text class="card-label" x="1210" y="1032" text-anchor="middle">server.ws.send(...)</text>
  <text class="card-note" x="1210" y="1059" text-anchor="middle">full-reload after a watched source changes</text>

  <path d="M 1210 190 V 280" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1210 334 V 424" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1210 478 V 568" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1210 622 V 712" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1210 766 V 856" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1210 910 V 1000" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M 1390 451 H 1450" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="branch-label" x="1402" y="443">no</text>
  <text class="branch-label" x="1230" y="517">yes</text>

  <text class="card-note" x="1210" y="236" text-anchor="middle">hook registration happens once per server instance</text>

  <g transform="translate(120,1140)">
    <rect x="0" y="0" width="120" height="28" rx="8" fill="#eef2ff" stroke="#3157c9" stroke-width="2"/>
    <text class="card-note" x="60" y="19" text-anchor="middle">entry</text>

    <rect x="150" y="0" width="120" height="28" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="card-note" x="210" y="19" text-anchor="middle">process</text>

    <rect x="300" y="0" width="120" height="28" rx="8" fill="#fffaf0" stroke="#d6a24e" stroke-width="2"/>
    <text class="card-note" x="360" y="19" text-anchor="middle">decision</text>

    <rect x="450" y="0" width="120" height="28" rx="8" fill="#f0fdf4" stroke="#9ac7a3" stroke-width="2"/>
    <text class="card-note" x="510" y="19" text-anchor="middle">effect</text>

    <rect x="600" y="0" width="120" height="28" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="card-note" x="660" y="19" text-anchor="middle">skip</text>

    <line x1="780" y1="14" x2="840" y2="14" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text class="card-note" x="786" y="38">solid control flow</text>
  </g>

  <text class="source-note" x="120" y="1332">Source: packages/plugins/event-map-generator/src/main.ts, src/scan/EventMapScanner.ts, src/generate/EventMapDeclarationUtils.ts, test/fixtures/basic/src/sample.ts</text>
  <text class="source-note" x="120" y="1354">The diagram documents the current scaffold behavior: event name discovery, declaration writing, and dev-time refresh after relevant file changes.</text>
</svg>
