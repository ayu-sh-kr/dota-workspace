<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1580" viewBox="0 0 2100 1580" role="img" aria-labelledby="title desc">
  <title id="title">Dota Vite Preloader virtual modules and router initialization flow</title>
  <desc id="desc">Annotated build and runtime flow. The Vite preloader scans exported decorated classes, serves virtual:dota-components and virtual:dota-routes as generated module source, and Vite bundles that source into the application output. virtual-modules.d.ts declares the public types only; it is not the generated runtime module and its virtual:dota-component-modules declaration has no generator here. dota-wrap passes the generated arrays into DotaRouterService, which uses the supplied route configuration or derives routes from components when no routes are supplied.</desc>

  <style>
    svg { background: #ffffff; text-rendering: geometricPrecision; }
    text { font-family: "DM Sans", "Poppins", Helvetica, Arial, sans-serif; fill: #1f2937; text-rendering: geometricPrecision; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #526174; }
    .lane-title { font-size: 18px; font-weight: 700; fill: #334155; }
    .lane-note { font-size: 14px; fill: #64748b; }
    .card-label { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .card-label-small { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .annotation { font-size: 14px; fill: #526174; }
    .branch { font-size: 14px; font-weight: 700; fill: #334155; }
    .terminal { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .legend { font-size: 13px; fill: #526174; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #526174; }
    .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 18; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
    .entry { fill: #eef2ff; stroke: #3157c9; }
    .process { fill: #ffffff; stroke: #cbd5e1; }
    .decision { fill: #fffaf0; stroke: #d6a24e; }
    .artifact { fill: #f0fdf4; stroke: #9ac7a3; }
    .noop { fill: #f8fafc; stroke: #94a3b8; }
    .connector { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector-no-arrow { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .rule { stroke: #dbe4ee; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="2100" height="1580" fill="#ffffff"/>

  <text x="70" y="58" class="title">Dota Vite Preloader: virtual modules → app bootstrap → router</text>
  <text x="70" y="88" class="subtitle">What is generated at build time, what only exists for TypeScript, and where the generated code ends up.</text>

  <rect x="60" y="140" width="1080" height="1020" class="lane"/>
  <rect x="1230" y="140" width="810" height="1320" class="lane"/>
  <rect x="60" y="1190" width="1080" height="270" class="lane"/>

  <text x="90" y="178" class="lane-title">1 · Vite build-time generation</text>
  <text x="90" y="202" class="lane-note">Plugin factory: dotaVitePreloader({ root: projectRoot })</text>
  <text x="1260" y="178" class="lane-title">2 · Runtime consumption</text>
  <text x="1260" y="202" class="lane-note">Source: packages/apps/dota-web/src/main.ts</text>
  <text x="90" y="1228" class="lane-title">Dev-only refresh path</text>
  <text x="90" y="1250" class="lane-note">configureServer(server) registers watcher handlers; this lane is not a build artifact.</text>

  <!-- Build-time primary spine: buildStart and the component cache. -->
  <rect x="130" y="220" width="300" height="54" class="card entry"/>
  <text x="280" y="254" text-anchor="middle" class="card-label">vite build</text>

  <rect x="130" y="350" width="300" height="54" class="card process"/>
  <text x="280" y="384" text-anchor="middle" class="card-label">buildStart()</text>
  <text x="130" y="428" class="annotation">eagerly scans and fills both plugin caches</text>

  <rect x="130" y="480" width="300" height="54" class="card process"/>
  <text x="280" y="514" text-anchor="middle" class="card-label">scanDotaComponents()</text>
  <text x="130" y="558" class="code">src/**/*.component.ts · src/pages/**/*.page.ts</text>
  <text x="130" y="578" class="annotation">fast-glob → SWC parse → exported @Component metadata</text>

  <rect x="130" y="610" width="300" height="54" class="card artifact"/>
  <text x="280" y="644" text-anchor="middle" class="card-label">cachedCandidates</text>
  <text x="130" y="688" class="annotation">page candidates are re-parsed for exported @Route metadata</text>

  <!-- Virtual import resolution and loading. -->
  <rect x="610" y="220" width="390" height="54" class="card entry"/>
  <text x="805" y="254" text-anchor="middle" class="card-label">main.ts imports virtual:* IDs</text>

  <rect x="610" y="350" width="390" height="54" class="card process"/>
  <text x="805" y="384" text-anchor="middle" class="card-label">resolveId(id)</text>
  <text x="610" y="428" class="code">virtual:* → \0virtual:*</text>
  <text x="610" y="448" class="annotation">Vite’s internal ID prevents disk lookup</text>

  <rect x="610" y="480" width="390" height="54" class="card process"/>
  <text x="805" y="514" text-anchor="middle" class="card-label">load(id)</text>
  <text x="610" y="558" class="annotation">reuses the cached scan; returns synthetic ES module source</text>

  <rect x="610" y="610" width="390" height="54" class="card decision"/>
  <text x="805" y="644" text-anchor="middle" class="card-label">which virtual module?</text>

  <rect x="260" y="800" width="300" height="54" class="card artifact"/>
  <text x="410" y="834" text-anchor="middle" class="card-label-small">virtual:dota-components</text>
  <text x="260" y="898" class="code">import { C } from './src/...';</text>
  <text x="260" y="918" class="code">export default [C, ...];</text>
  <text x="260" y="938" class="annotation">component constructor array</text>

  <rect x="760" y="800" width="300" height="54" class="card artifact"/>
  <text x="910" y="834" text-anchor="middle" class="card-label-small">virtual:dota-routes</text>
  <text x="760" y="898" class="code">import { Page } from './src/...';</text>
  <text x="760" y="918" class="code">export const routeConfig = [...]</text>
  <text x="760" y="938" class="annotation">path + component + optional flags</text>

  <rect x="610" y="960" width="390" height="54" class="card artifact"/>
  <text x="805" y="994" text-anchor="middle" class="card-label">Vite bundles generated source</text>
  <text x="610" y="1048" class="annotation">No virtual:dota-*.ts file is written; code is folded into dist/assets/*.js</text>

  <!-- Build connectors. -->
  <path d="M 280 274 V 350" class="connector"/>
  <path d="M 280 404 V 480" class="connector"/>
  <path d="M 280 534 V 610" class="connector"/>
  <path d="M 805 274 V 350" class="connector"/>
  <path d="M 805 404 V 480" class="connector"/>
  <path d="M 805 534 V 610" class="connector"/>
  <path d="M 430 637 H 520 V 507 H 610" class="connector"/>
  <text x="454" y="626" class="branch">cache reused</text>
  <path d="M 805 664 V 720 H 410 V 800" class="connector"/>
  <text x="420" y="710" class="branch">components</text>
  <path d="M 1000 637 H 1050 V 774 H 910 V 800" class="connector"/>
  <text x="970" y="708" class="branch">routes</text>
  <path d="M 410 854 V 900 H 805 V 960" class="connector"/>
  <path d="M 910 854 V 900 H 805 V 960" class="connector"/>

  <!-- Runtime lane. -->
  <rect x="1330" y="220" width="600" height="54" class="card entry"/>
  <text x="1630" y="254" text-anchor="middle" class="card-label">main.ts consumes generated exports</text>
  <text x="1330" y="308" class="code">components ← virtual:dota-components</text>
  <text x="1330" y="328" class="code">routeConfig ← virtual:dota-routes</text>

  <rect x="1330" y="350" width="600" height="54" class="card process"/>
  <text x="1630" y="384" text-anchor="middle" class="card-label">initializeApp({ modules, routes })</text>

  <rect x="1330" y="480" width="600" height="54" class="card process"/>
  <text x="1630" y="514" text-anchor="middle" class="card-label-small">registerComponents(modules, externalComponents)</text>
  <text x="1330" y="558" class="annotation">generated constructors + explicitly supplied UI components</text>

  <rect x="1330" y="610" width="600" height="54" class="card artifact"/>
  <text x="1630" y="644" text-anchor="middle" class="card-label">bootstrap(components)</text>
  <text x="1330" y="688" class="annotation">dota-core registers the custom elements</text>

  <rect x="1330" y="740" width="600" height="54" class="card process"/>
  <text x="1630" y="774" text-anchor="middle" class="card-label">registerRoutes(..., routes)</text>
  <text x="1330" y="818" class="annotation">dota-wrap delegates to DotaRouterService.fromComponents()</text>

  <rect x="1330" y="870" width="330" height="54" class="card decision"/>
  <text x="1495" y="904" text-anchor="middle" class="card-label-small">routes.length &gt; 0?</text>

  <rect x="1330" y="1040" width="330" height="54" class="card process"/>
  <text x="1495" y="1074" text-anchor="middle" class="card-label-small">DotaRouterService.fromComponents</text>

  <rect x="1760" y="1040" width="260" height="54" class="card noop"/>
  <text x="1890" y="1074" text-anchor="middle" class="card-label-small">RouterUtils.prepareConfig</text>
  <text x="1760" y="1118" class="annotation">only when no routeConfig is supplied</text>

  <rect x="1330" y="1170" width="330" height="54" class="card process"/>
  <text x="1495" y="1204" text-anchor="middle" class="card-label">init()</text>
  <text x="1330" y="1248" class="annotation">constructs DomHistoryRouter with routes, fallbacks, and root</text>

  <rect x="1330" y="1300" width="330" height="54" class="card artifact"/>
  <text x="1495" y="1334" text-anchor="middle" class="card-label">RouterService returned</text>
  <text x="1330" y="1378" class="annotation">main.ts stores the service and can call routerService.route(path)</text>

  <!-- Runtime connectors. -->
  <path d="M 1630 274 V 350" class="connector"/>
  <path d="M 1630 404 V 480" class="connector"/>
  <path d="M 1630 534 V 610" class="connector"/>
  <path d="M 1630 664 V 740" class="connector"/>
  <path d="M 1630 794 V 830 H 1495 V 870" class="connector"/>
  <path d="M 1495 924 V 1040" class="connector"/>
  <text x="1505" y="970" class="branch">yes: use supplied routeConfig</text>
  <path d="M 1660 897 H 1890 V 1040" class="connector"/>
  <text x="1680" y="885" class="branch">no</text>
  <path d="M 1890 1094 V 1130 H 1680 V 1067 H 1660" class="connector"/>
  <text x="1730" y="1148" class="branch">fallback route list</text>
  <path d="M 1495 1094 V 1170" class="connector"/>
  <path d="M 1495 1224 V 1300" class="connector"/>

  <!-- Cross-lane handoff: the virtual module source becomes part of the app bundle. -->
  <path d="M 1000 987 H 1160 V 247 H 1330" class="connector"/>
  <text x="1020" y="974" class="branch">bundled app entry</text>

  <!-- Dev-server watcher lane. -->
  <rect x="120" y="1270" width="240" height="52" class="card entry"/>
  <text x="240" y="1303" text-anchor="middle" class="card-label">configureServer(server)</text>

  <rect x="440" y="1270" width="280" height="52" class="card process"/>
  <text x="580" y="1303" text-anchor="middle" class="card-label-small">watcher add / change / unlink</text>

  <rect x="800" y="1270" width="240" height="52" class="card decision"/>
  <text x="920" y="1303" text-anchor="middle" class="card-label-small">isComponentFile?</text>

  <rect x="800" y="1392" width="240" height="52" class="card artifact"/>
  <text x="920" y="1425" text-anchor="middle" class="card-label-small">invalidate + full-reload</text>

  <path d="M 360 1296 H 440" class="connector"/>
  <path d="M 720 1296 H 800" class="connector"/>
  <path d="M 920 1322 V 1392" class="connector"/>
  <text x="932" y="1356" class="branch">yes</text>
  <path d="M 1040 1296 H 1080" class="connector-no-arrow"/>
  <text x="1050" y="1286" class="terminal">no → ignore</text>
  <text x="440" y="1358" class="annotation">change: AST-diff class / selector / route metadata</text>
  <text x="440" y="1378" class="annotation">metadata changed → reload; implementation-only → normal Vite HMR</text>

  <!-- Legend and source notes. -->
  <line x1="70" y1="1490" x2="2030" y2="1490" class="rule"/>
  <text x="70" y="1520" class="lane-title">Legend</text>
  <rect x="160" y="1503" width="22" height="22" class="entry" rx="5"/>
  <text x="192" y="1520" class="legend">entry / import / hook</text>
  <rect x="350" y="1503" width="22" height="22" class="process" rx="5"/>
  <text x="382" y="1520" class="legend">processing</text>
  <rect x="500" y="1503" width="22" height="22" class="decision" rx="5"/>
  <text x="532" y="1520" class="legend">decision / guard</text>
  <rect x="690" y="1503" width="22" height="22" class="artifact" rx="5"/>
  <text x="722" y="1520" class="legend">generated / persisted effect</text>
  <rect x="930" y="1503" width="22" height="22" class="noop" rx="5"/>
  <text x="962" y="1520" class="legend">fallback / no-op branch</text>
  <path d="M 1190 1514 H 1240" class="connector"/>
  <text x="1260" y="1520" class="legend">solid arrow = synchronous control/data flow</text>
  <text x="70" y="1550" class="annotation">Type-only check: virtual-modules.d.ts matches the public shapes of the two generated modules; its extra virtual:dota-component-modules declaration has no generator in this plugin.</text>
  <text x="70" y="1568" class="annotation">Sources: packages/plugins/dota-vite-preloader/src/main.ts · packages/plugins/dota-vite-preloader/src/domain/* · packages/apps/dota-web/src/main.ts · packages/libs/dota-wrap/src/index.ts · packages/libs/dota-router/src/DotaRouterService.ts</text>
</svg>
