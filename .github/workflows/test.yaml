name: Test
on:
  push:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 7
      - uses: actions/setup-node@v5
        with:
          node-version: 25.x
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm run test